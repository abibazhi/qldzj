<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经 图片浏览</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      z-index: 10;
    }

    .error-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      z-index: 10;
      display: none;
    }

    .page-info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 10;
    }

    .controls {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    .control-btn {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      cursor: pointer;
    }

    .source-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      color: #0f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      z-index: 20;
      pointer-events: none;
    }
  </style>


  <!-- 🔥 模块顺序：工具 → 翻页 → 图片加载 -->
  <script type="module" src="./js/utils.js"></script>
  <script type="module" src="./js/pageNav.js"></script>
  <!-- 🔥 加这一行引入新引擎 -->
  <script type="module" src="./js/imageLoader.js"></script>

<script>

</head>
<body>

<div class="container">
  <div class="image-wrapper" id="imageWrapper">
    <img id="imageView" src="" alt="乾隆大藏经图片"/>
  </div>
  <div class="loading-indicator" id="loadingIndicator">加载中...</div>
  <div class="error-message" id="errorMessage">图片加载失败</div>
  <div class="page-info" id="pageInfo"></div>
  <div class="source-badge" id="sourceBadge">---</div>

  <div class="controls">
    <button class="control-btn" id="zoomOutBtn">-</button>
    <button class="control-btn" id="resetBtn">1:1</button>
    <button class="control-btn" id="zoomInBtn">+</button>
  </div>
</div>

<script type="module">
  // 🔥 直接导入公共翻页状态
  import {
    currentVol,
    currentPage,
    calcNextPage,
    setCurrentPage,
    RANGE
  } from './js/pageNav.js';
  
  import { getBestImageUrl } from './js/imageLoader.js'


  // 缩放和拖拽相关变量
  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let lastScaleDistance = 0;
  let isLoading = false;
  let touchMode = null;
  let startX = 0, startY = 0;
  let startTranslateX = 0, startTranslateY = 0;
  let startTime = 0;
  let scaleFactor = 1.1;
  let zoomSensitivity = 0.1;
  let dragSpeedFactor = 1.5;
  
  const imageWrapper = document.getElementById('imageWrapper');
  const imageView = document.getElementById('imageView');
  const loadingIndicator = document.getElementById('loadingIndicator');
  const errorMessage = document.getElementById('errorMessage');
  const pageInfo = document.getElementById('pageInfo');
  const sourceBadge = document.getElementById('sourceBadge');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const resetBtn = document.getElementById('resetBtn');
  
  function showLoading() {
    if (isLoading) return;
    isLoading = true;
    loadingIndicator.style.display = 'block';
    errorMessage.style.display = 'none';
  }
  
  function hideLoading() {
    isLoading = false;
    loadingIndicator.style.display = 'none';
  }
  
  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = 'block';
    setTimeout(() => {
      errorMessage.style.display = 'none';
    }, 3000);
  }
  
  function updatePageInfo() {
    pageInfo.textContent = `第 ${currentVol} 册 第 ${currentPage} 页`;
  }
  
  function updateTransform() {
    imageWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  }
  
async function loadImage(vol, page) {
  showLoading();
  try {
    const best = await getBestImageUrl(vol, page);
    if (best) {
      imageView.src = best.url;
      sourceBadge.textContent = best.key;
    } else {
      showError("加载失败");
    }
  } catch (e) {
    console.error(e);
    showError("加载异常");
  }
  hideLoading();
}

// 🔥 🔥 🔥 翻页：完全复用公共逻辑！！！
async function changeImage(direction) {
  if (isLoading) return;

  // 公共计算
  const res = calcNextPage(direction);
  if (!res.ok) {
    showError(direction > 0 ? "已经是最后一页" : "已经是第一页");
    return;
  }

  const { newVol, newPage } = res;
  await loadImage(newVol, newPage);
  
  // 更新全局状态
  setCurrentPage(newVol, newPage);
  updatePageInfo();
}
  
  function zoomAtCenter(centerX, centerY, scaleRatio) {
    const oldScale = scale;
    scale = Math.max(1, Math.min(5, scale * scaleRatio));
    
    translateX = centerX - ((centerX - translateX) * (scale / oldScale));
    translateY = centerY - ((centerY - translateY) * (scale / oldScale));
    
    const maxTranslateX = (scale - 1) * window.innerWidth / 2;
    const maxTranslateY = (scale - 1) * window.innerHeight / 2;
    
    translateX = Math.max(-maxTranslateX, Math.min(maxTranslateX, translateX));
    translateY = Math.max(-maxTranslateY, Math.min(maxTranslateY, translateY));
    
    updateTransform();
  }
  
  function resetView() {
    scale = 1;
    translateX = 0;
    translateY = 0;
    updateTransform();
  }
  
  // 触摸事件处理
  imageWrapper.addEventListener('touchstart', (event) => {
    if (event.touches.length === 2) {
      touchMode = 'scale';
      const dx = event.touches[0].clientX - event.touches[1].clientX;
      const dy = event.touches[0].clientY - event.touches[1].clientY;
      lastScaleDistance = Math.sqrt(dx * dx + dy * dy);
      startTranslateX = translateX;
      startTranslateY = translateY;
    } else if (event.touches.length === 1) {
      if (scale > 1.0) {
        touchMode = 'drag';
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
        startTranslateX = translateX;
        startTranslateY = translateY;
      } else {
        touchMode = 'swipe';
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
        startTime = Date.now();
      }
    }
  });
  
  imageWrapper.addEventListener('touchmove', (event) => {
    if (touchMode === 'scale' && event.touches.length === 2) {
      event.preventDefault();
      const dx = event.touches[0].clientX - event.touches[1].clientX;
      const dy = event.touches[0].clientY - event.touches[1].clientY;
      const currentDistance = Math.sqrt(dx * dx + dy * dy);
      const scaleRatio = 1 + (currentDistance / lastScaleDistance - 1) * zoomSensitivity;
      const centerX = (event.touches[0].clientX + event.touches[1].clientX) / 2;
      const centerY = (event.touches[0].clientY + event.touches[1].clientY) / 2;
      zoomAtCenter(centerX, centerY, scaleRatio);
      lastScaleDistance = currentDistance;
    } else if (touchMode === 'drag' && event.touches.length === 1) {
      event.preventDefault();
      const currentX = event.touches[0].clientX;
      const currentY = event.touches[0].clientY;
      translateX = startTranslateX + (currentX - startX) * dragSpeedFactor;
      translateY = startTranslateY + (currentY - startY) * dragSpeedFactor;
      const maxTranslateX = (scale - 1) * window.innerWidth / 2;
      const maxTranslateY = (scale - 1) * window.innerHeight / 2;
      translateX = Math.max(-maxTranslateX, Math.min(maxTranslateX, translateX));
      translateY = Math.max(-maxTranslateY, Math.min(maxTranslateY, translateY));
      updateTransform();
    } else if (touchMode === 'swipe' && event.touches.length === 1) {
      const deltaY = event.touches[0].clientY - startY;
      if (Math.abs(deltaY) > 50) {
        touchMode = null;
      }
    }
  });
  
  imageWrapper.addEventListener('touchend', (event) => {
    if (touchMode === 'swipe' && event.changedTouches.length === 1) {
      const endX = event.changedTouches[0].clientX;
      const deltaX = endX - startX;
      const duration = Date.now() - startTime;
      if (Math.abs(deltaX) > 50 && duration < 500) {
        if (deltaX > 0) {
          changeImage(-1);
        } else {
          changeImage(1);
        }
      }
    }
    touchMode = null;
  });
  
  zoomInBtn.addEventListener('click', () => {
    zoomAtCenter(window.innerWidth / 2, window.innerHeight / 2, scaleFactor);
  });
  
  zoomOutBtn.addEventListener('click', () => {
    zoomAtCenter(window.innerWidth / 2, window.innerHeight / 2, 1 / scaleFactor);
  });
  
  resetBtn.addEventListener('click', resetView);
  
  // 页面初始化
  window.onload = async () => {
    console.log('页面加载启动...');
    
    updatePageInfo();
    await loadImage(currentVol, currentPage);
  };
</script>

</body>
</html>
