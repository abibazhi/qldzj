<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Markdown 带侧边栏</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-gfm-heading-id/lib/index.umd.js"></script>
  <style>
    body { display: flex; margin: 0; font-family: sans-serif; }
    #sidebar {
      width: 240px; padding: 20px; border-right: 1px solid #eee;
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
    }
    #content { flex: 1; padding: 20px; max-width: 800px; }
    #sidebar ul { list-style: none; padding-left: 0; }
    #sidebar li { margin: 6px 0; }
    #sidebar a { text-decoration: none; color: #0366d6; }
    #sidebar .h2 { padding-left: 12px; font-size: 0.9em; }
    #sidebar .h3 { padding-left: 24px; font-size: 0.85em; }
  </style>
</head>
<body>
  <div id="sidebar"><ul id="toc"></ul></div>
  <div id="content">加载中...</div>

  <script>
    // const url = 'https://example.com/your-file.md'; // ← 改成你的 md 地址
    const url = './docs/' + encodeURIComponent('乾隆大藏经版本考据.md');

    // 使用插件，让 marked 像 GitHub 一样生成标题 id，并记录标题列表
    marked.use(gfmHeadingId(), {
      hooks: {
        postprocess(html) {
          const headings = getHeadingList();
          const tocHtml = headings.map(h => 
            `<li class="h${h.level}"><a href="#${h.id}">${h.raw}</a></li>`
          ).join('');
          document.getElementById('toc').innerHTML = tocHtml;
          return html;
        }
      }
    });

    fetch(url)
      .then(r => r.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(err => {
        document.getElementById('content').textContent = '加载失败: ' + err.message;
      });
  </script>
</body>
</html>
