<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经图片浏览</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .container {
      width: 100vw;
      height: 100vh;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: transparent;
      padding: 10px;
      box-shadow: 0 0 0 5px blue;
      box-sizing: border-box;
      touch-action: none; /* 👈 加这个 */
      transition: transform 0.05s linear; /* 👈 改这个，变成极低延迟 */
      /* touch-action: pan-x pan-y;*/
      /*transition: transform 0.3s ease-in-out;*/
      position: relative;
      user-select: none;
    }

    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
    }

    .source-badge {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #0f0;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      z-index: 100;
      pointer-events: none;
    }

    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 999;
    }
    .control-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    .hover-tooltip {
      position: fixed;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #floatTip {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #c0392b;
      color: #fff;
      padding: 8px 20px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 10000;
      display: none;
    }
  </style>

  <script type="module" src="./js/utils.js"></script>
  <script type="module" src="./js/pageNav.js"></script>
  <script type="module" src="./js/imageLoader.js"></script>
  <script type="module" src="./js/viewerTool.js"></script>

</script>
</head>
<body>

<div id="imageContainer" class="container">
  <div id="loadingIndicator" class="loading-indicator">加载中...</div>
  <div id="sourceBadge" class="source-badge">---</div>
</div>

<div class="controls">
  <button class="control-btn" id="zoomOutBtn">-</button>
  <button class="control-btn" id="resetBtn">1:1</button>
  <button class="control-btn" id="zoomInBtn">+</button>
</div>

<div id="hoverTip" class="hover-tooltip">提示</div>
<div id="floatTip"></div>

<script type="module">
import { getBestImageUrl } from './js/imageLoader.js';
import { currentVol, currentPage, calcNextPage, setCurrentPage } from './js/pageNav.js';
import { resetView, stepZoom, initDrag, showTempTip, currentScale, applyTransform } from './js/viewerTool.js';

let isLoading = false;
const edgeThreshold = 0.05;

const container = document.getElementById('imageContainer');
const loadingIndicator = document.getElementById('loadingIndicator');
const sourceBadge = document.getElementById('sourceBadge');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const resetBtn = document.getElementById('resetBtn');
const hoverTip = document.getElementById('hoverTip');

initDrag(container);

function showTip(x, y, text) {
  hoverTip.style.left = x + 'px';
  hoverTip.style.top = y + 'px';
  hoverTip.textContent = text;
  hoverTip.style.opacity = 1;
}
function hideTip() {
  hoverTip.style.opacity = 0;
}

function showLoading() {
  if (isLoading) return;
  isLoading = true;
  loadingIndicator.style.display = 'block';
}
function hideLoading() {
  isLoading = false;
  loadingIndicator.style.display = 'none';
}

async function loadImage(vol, page) {
  showLoading();
  try {
    const best = await getBestImageUrl(vol, page);
    if (best) {
      container.style.backgroundImage = `url(${best.url})`;
      sourceBadge.textContent = best.key;
    } else {
      container.style.backgroundImage = "none";
      container.style.backgroundColor = "#222";
      sourceBadge.textContent = "失败";
    }
  } catch (e) { console.error(e); }
  hideLoading();
}

async function changeImage(direction) {
  if (currentScale > 1 || isLoading) return;

  const res = calcNextPage(direction);
  if (!res.ok) {
    showTempTip(direction > 0 ? "已经是最后一页" : "已经是第一页");
    return;
  }

  const { newVol, newPage } = res;
  await loadImage(newVol, newPage);
  setCurrentPage(newVol, newPage);
}

container.addEventListener('mousemove', e => {
  const r = container.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;
  const w = r.width;
  const h = r.height;

  const left = x < w * edgeThreshold;
  const right = x > w * (1 - edgeThreshold);
  const top = y < h * 0.05;
  const bottom = y > h * 0.95;

  if (left) {
    showTip(e.clientX, e.clientY - 30, "← 上一页");
  } else if (right) {
    showTip(e.clientX, e.clientY - 30, "下一页 →");
  } else if (top) {
    showTip(e.clientX, e.clientY + 20, "双击放大顶部");
  } else if (bottom) {
    showTip(e.clientX, e.clientY - 50, "双击放大底部");
  } else {
    hideTip();
  }
});

container.addEventListener('mouseleave', hideTip);

container.addEventListener('click', e => {
  const r = container.getBoundingClientRect();
  const x = e.clientX - r.left;
  const w = r.width;
  if (x < w * edgeThreshold) changeImage(-1);
  else if (x > w * (1 - edgeThreshold)) changeImage(1);
});

// 🔥 双击逻辑：干净、标准、无hack
container.addEventListener('dblclick', e => {
  if (isLoading) return;
  if (currentScale > 1) {
    resetView(container);
    return;
  }

  const r = container.getBoundingClientRect();
  const y = e.clientY - r.top;
  const h = r.height;
  const top = y < h * 0.05;
  const bottom = y > h * 0.95;

  if (top) {
    applyTransform(container, 2.4, '50%', '11.8%');
  } else if (bottom) {
    applyTransform(container, 2.4, '50%', '80%');
  }
});

zoomInBtn.addEventListener('click', () => stepZoom(container, true));
zoomOutBtn.addEventListener('click', () => stepZoom(container, false));
resetBtn.addEventListener('click', () => resetView(container));

zoomInBtn.addEventListener('mouseenter', () => {
  const rect = zoomInBtn.getBoundingClientRect();
  showTip(rect.x, rect.y - 40, "放大");
});
zoomOutBtn.addEventListener('mouseenter', () => {
  const rect = zoomOutBtn.getBoundingClientRect();
  showTip(rect.x, rect.y - 40, "缩小");
});
resetBtn.addEventListener('mouseenter', () => {
  const rect = resetBtn.getBoundingClientRect();
  showTip(rect.x, rect.y - 40, "重置 1:1");
});

zoomInBtn.addEventListener('mouseleave', hideTip);
zoomOutBtn.addEventListener('mouseleave', hideTip);
resetBtn.addEventListener('mouseleave', hideTip);

window.onload = () => loadImage(currentVol, currentPage);
</script>


<script src="js/tongji.baidu.js"></script>
</body>
</html>
