// ======================================
// 🔥 自动判断当前环境：Cloudflare / GitHub / 本地
// ======================================
function getCurrentEnv() {
  const host = window.location.host.toLowerCase();
  
  if (host.includes("github.io")) {
    return "github";
  }
  
  if (host.includes("daxumi.top") || host.includes("cloudflare")) {
    return "cloudflare";
  }

  return "local";
}

  // ========== 配置区域 ==========
  // 加载策略: 'local' (仅本地), 'imgbb' (仅远程), 'fallback' (远程优先，失败回退本地)

  // 动态加载对应卷的 mapping.js（极简干净版）
  async function loadMappingForVolume1(vol) {

    // 👇 加这一行：如果页面上已经加载过这个卷的js，直接返回，不重复加载
    if (document.querySelector(`script[src="/${vol}/mapping.js"]`)) return;

    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      // 👇 去掉版本号，让浏览器自动缓存
      script.src = `/${vol}/mapping.js`;

      script.onload = resolve;
      script.onerror = reject;
      document.body.appendChild(script);
    });
  }

async function loadMappingForVolume(vol) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');

    // 自动判断：Cloudflare / GitHub 自动切换
    let src;
    const env = getCurrentEnv();
    if (env === "cloudflare") {
      // R2 上的完整地址
      src = `https://pub-a0fc4de2782d448f916244913768fb78.r2.dev/${vol}/mapping.js`;
    } else {
      // GitHub / 本地 用相对路径
      src = `/${vol}/mapping.js`;
    }

    console.log("🔗 正在加载 JS:", src);

    script.src = src;
    script.onload = () => {
      console.log("✅ JS 加载完成:", src);
      resolve();
    };
    script.onerror = (err) => {
      console.error("❌ JS 加载失败:", src, err);
      reject(err);
    };
    document.head.appendChild(script);
  });
}



  function getQueryVariable(variable) {
    const query = window.location.search.substring(1);
    const vars = query.split('&');
    for (let i = 0; i < vars.length; i++) {
      const pair = vars[i].split('=');
      if (pair[0] === variable) return decodeURIComponent(pair[1]);
    }
    return false;
  }

  const startParam = getQueryVariable('start') || '001001';
  const endParam = getQueryVariable('end') || '999999';

  // 检测参数长度并相应分割
  function splitVolumeAndPage(param) {
    const len = param.length;
    let vol, page;

    if (len === 6) {
      vol = param.slice(0, 3);
      page = param.slice(3, 6);
    } else if (len === 7) {
      vol = param.slice(0, 3);
      page = param.slice(3, 7);
    } else {
      vol = param.slice(0, 3);
      page = param.slice(3);
    }

    return { vol, page };
  }

  const start = splitVolumeAndPage(startParam);
  const end = splitVolumeAndPage(endParam);

  const startVol = start.vol;
  const startPage = start.page;
  const endVol = end.vol;
  const endPage = end.page;

  let currentPage = startPage;
  let currentVol = startVol;
  let zoomed = false;
  let isLoading = false;

  const edgeThreshold = 0.05;
  const container = document.getElementById('imageContainer');
  const loadingIndicator = document.getElementById('loadingIndicator');
  const sourceBadge = document.getElementById('sourceBadge');

  function showLoading() {
    if (isLoading) return;
    isLoading = true;
    loadingIndicator.style.display = 'block';
  }

  function hideLoading() {
    isLoading = false;
    loadingIndicator.style.display = 'none';
  }

  // 获取本地图片路径
  function getLocalImageUrl1(vol, page) {
    const pageNum = parseInt(page, 10);
    return `/qldzj/pngs/${vol}/${pageNum}.png`;
  }

  // 换成这个
  function getLocalImageUrl(vol, page) {
    const pageNum = parseInt(page, 10);
    return `../${vol}/${pageNum}.png`;
  }

// ======================================
// 生成三个平台的路径（完全兼容你现有代码）
// ======================================
function getImageUrls(vol, page) {
  const pageNum = parseInt(page, 10);

  // 1. R2 正式地址
  const r2 = `https://pub-a0fc4de2782d448f916244913768fb78.r2.dev/${vol}/${pageNum}.png`;

  // 2. GitHub / 本地 相对路径
  const github = `/${vol}/${pageNum}.png`;

  // 3. ImgBB 备胎（沿用你原来的 mapping 逻辑）
  let imgbb = null;
  if (urlMapping) {
    const volNum = parseInt(vol, 10);
    const pageNumInt = parseInt(page, 10);
    if (urlMapping[volNum] && urlMapping[volNum][pageNumInt - 1]) {
      const id = urlMapping[volNum][pageNumInt - 1];
      imgbb = `https://i.ibb.co/${id}/${vol}-${pageNum}-png.png`;
    }
  }

  return { r2, github, imgbb };
}



  // 获取 ImgBB 图片路径（适配只存随机ID的 mapping.json）
  function getImgbbrl(vol, page) {
    if (!urlMapping) return null;
    //const key = `${vol}_${parseInt(page, 10)}`;
    //const randomId = urlMapping[key];

    const volNum = parseInt(vol, 10);
    const pageNum = parseInt(page, 10);
    const randomId = urlMapping[volNum][pageNum - 1];

    if (!randomId) return null;
    
    // 拼接完整 URL
    //const pageNum = parseInt(page, 10);
    const filename = `${vol}-${pageNum}-png.png`;
    return `https://i.ibb.co/${randomId}/${filename}`;
  }


  // 尝试加载单张图片
  function tryLoadImage1(url) {
    return new Promise((resolve) => {
      const img = new Image();
      const timeout = setTimeout(() => {
        img.onload = null;
        img.onerror = null;
        resolve({ success: false, error: 'timeout' });
      }, 10000);

      img.onload = () => {
        clearTimeout(timeout);
        resolve({ success: true, img: img });
      };

      img.onerror = () => {
        clearTimeout(timeout);
        resolve({ success: false, error: 'load error' });
      };

      img.src = url;
    });
  }


// 尝试加载单张图片
function tryLoadImage(url) {
  return new Promise((resolve) => {

    // 调试日志
    console.log('🔗 尝试加载图片地址:', url);

}


  // 带回退的图片加载
  // 新的（本地优先）
  async function loadImage1(vol, page) {
    showLoading();

    // 1. 先加载当前卷的 mapping.js
    await loadMappingForVolume(vol);

    // 2. 加载完了，mappingData 才存在，这里赋值
    const urlMapping = mappingData;

    const localUrl = getLocalImageUrl(vol, page);
    const imgbbUrl = getImgbbrl(vol, page);
    
    // 失败再试 imgbb
    if (imgbbUrl) {

// ======================================
// 🔥 智能加载：根据域名自动选择优先顺序
// ======================================
async function loadImage2(vol, page) {

  // ========== 调试日志开始 ==========
  console.log('======================================');
  console.log('🖼️ 加载图片 vol=', vol, ' page=', page);
  console.log('🌍 当前域名环境:', getCurrentEnv());
  // ========== 调试日志结束 ==========

  showLoading();
  await loadMappingForVolume(vol);
  urlMapping = mappingData;

  const env = getCurrentEnv();
  const { r2, github, imgbb } = getImageUrls(vol, page);

  let primaryUrl, backupUrl, sourceText;

  // ---------------------------
  // 策略 1：Cloudflare / 自定义域名
  // ---------------------------
  if (env === "cloudflare") {
    primaryUrl = r2;
    backupUrl = imgbb;
    sourceText = "R2 🚀";
  }

  // ---------------------------
  // 策略 2：GitHub / 本地
  // ---------------------------
  else {
    primaryUrl = github;
    backupUrl = imgbb;
    sourceText = env === "github" ? "GitHub 🛡️" : "本地 🖥️";
  }

  // ---------------------------
  // 执行：先主 → 失败 → 备胎 ImgBB
  // ---------------------------
  const primaryResult = await tryLoadImage(primaryUrl);
  if (primaryResult.success) {
    container.style.backgroundImage = `url(${primaryUrl})`;
    sourceBadge.textContent = sourceText;
    hideLoading();
    return;
  }

  // 备胎：ImgBB（所有环境共用）
  if (backupUrl) {
    const backupResult = await tryLoadImage(backupUrl);
    if (backupResult.success) {
      container.style.backgroundImage = `url(${backupUrl})`;
      sourceBadge.textContent = "ImgBB 📦";
      hideLoading();
      return;
    }
  }

  // 全部失败
  container.style.backgroundImage = "none";
  container.style.backgroundColor = "#222";
  hideLoading();
}

async function loadImage(vol, page) {
  console.log('======================================');
  console.log('🖼️ 加载图片 vol=', vol, ' page=', page);
  console.log('🌍 当前域名环境:', getCurrentEnv());

  showLoading();

  // ===========================================
  // 🔥 最关键：mapping 加载失败，直接忽略，不崩溃！
  // ===========================================
  try {
    console.log("🔍 尝试加载 mapping.js:", vol + "/mapping.js");
    await loadMappingForVolume(vol);
    urlMapping = mappingData;
    console.log("✅ mapping.js 加载成功！");
  } catch (err) {
    console.log("⚠️ mapping.js 加载失败，但继续加载图片！", err);
    urlMapping = null;
  }

  const env = getCurrentEnv();
  const { r2, github, imgbb } = getImageUrls(vol, page);

  let primaryUrl, backupUrl, sourceText;

  if (env === "cloudflare") {
    primaryUrl = r2;
    backupUrl = imgbb;
    sourceText = "R2 🚀";
  } else {
    primaryUrl = github;
    backupUrl = imgbb;
    sourceText = env === "github" ? "GitHub 🛡️" : "本地 🖥️";
  }

  console.log("🎯 主图片地址:", primaryUrl);

  // 加载主图片
  try {
    const primaryResult = await tryLoadImage(primaryUrl);
    if (primaryResult.success) {
      container.style.backgroundImage = `url(${primaryUrl})`;
      sourceBadge.textContent = sourceText;
      hideLoading();
      console.log("✅ 图片加载成功！");
      return;
    }
  } catch (e) {
    console.log("❌ 主图片加载失败");
  }

  // 兜底：显示错误
  console.log("❌ 所有图片源都加载失败");
  container.style.backgroundImage = "none";
  container.style.backgroundColor = "#222";
  hideLoading();
}

  async function changeImage(direction) {
    if (zoomed || isLoading) return;

    let currentPageNum = parseInt(currentPage, 10);
    let currentVolNum = parseInt(currentVol, 10);
    let startPageNum = parseInt(startPage, 10);
    let startVolNum = parseInt(startVol, 10);
    let endPageNum = parseInt(endPage, 10);
    let endVolNum = parseInt(endVol, 10);

    let newPage = currentPageNum + direction;
    let newVol = currentVolNum;

    if (direction > 0) {
      const maxPage = currentPage.length === 4 ? 9999 : 999;
      if (newPage > maxPage) {
        newPage = 1;
        newVol += 1;
      }
    } else {
      if (newPage < 1) {
        if (currentPageNum === 1) {
          return;
        } else {
          const maxPage = currentPage.length === 4 ? 9999 : 999;
          newPage = maxPage;
          newVol -= 1;
        }
      }
    }

    newVol = newVol.toString().padStart(3, '0');
    if (currentPage.length === 4) {
      newPage = newPage.toString().padStart(4, '0');
    } else {
      newPage = newPage.toString().padStart(3, '0');
    }

    if (
      (parseInt(newVol, 10) < startVolNum) ||
      (parseInt(newVol, 10) === startVolNum && parseInt(newPage, 10) < startPageNum) ||
      (parseInt(newVol, 10) > endVolNum) ||
      (parseInt(newVol, 10) === endVolNum && parseInt(newPage, 10) > endPageNum)
    ) {
      return;
    }

    try {
      await loadImage(newVol, newPage);
      currentPage = newPage;
      currentVol = newVol;
    } catch (err) {
      console.error('图片加载失败:', err);
    }
  }

  function updateCursor(event) {
    const rect = event.target.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    const width = rect.width;
    const height = rect.height;

    const isTopEdge = y < height * edgeThreshold;
    const isBottomEdge = y > height * (1 - edgeThreshold);
    const isLeftEdge = x < width * edgeThreshold;
    const isRightEdge = x > width * (1 - edgeThreshold);

    if (isTopEdge || isBottomEdge || isLeftEdge || isRightEdge) {
      container.style.cursor = 'pointer';
    } else {
      container.style.cursor = 'auto';
    }
  }

  container.addEventListener('mousemove', updateCursor);
  container.addEventListener('mouseleave', () => {
    container.style.cursor = 'auto';
  });

  container.addEventListener('click', (event) => {
    if (isLoading) return;

    const rect = event.target.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const width = rect.width;

    const isLeftEdge = clickX < width * edgeThreshold;
    const isRightEdge = clickX > width * (1 - edgeThreshold);

    if (isLeftEdge) {
      changeImage(-1);
    } else if (isRightEdge) {
      changeImage(1);
    }
  });

  container.addEventListener('dblclick', handleDoubleClick);

  function handleDoubleClick(event) {
    if (isLoading) return;

    if (zoomed) {
      zoomOut();
      return;
    }

    const rect = container.getBoundingClientRect();
    const y = event.clientY - rect.top;
    const height = rect.height;

    const isTopEdge = y < height * 0.05;
    const isBottomEdge = y > height * 0.95;

    if (isTopEdge) {
      zoomToPosition(0, 'top');
    } else if (isBottomEdge) {
      zoomToPosition(0, 'bottom');
    }
  }

  function zoomToPosition(clickX, position) {
    const scale = 2.4;
    let transformOriginY = 'center';

    if (position === 'top') {
      transformOriginY = '11.8%';
    } else if (position === 'bottom') {
      transformOriginY = '80%';
    }

    container.style.transformOrigin = `50% ${transformOriginY}`;
    container.style.transform = `scale(${scale})`;
    container.style.backgroundSize = 'contain';
    container.style.backgroundPosition = 'center';

    zoomed = true;
  }

  function zoomOut() {
    container.style.transformOrigin = 'center';
    container.style.transform = 'scale(1)';
    container.style.backgroundSize = 'contain';
    container.style.backgroundPosition = 'center';

    zoomed = false;
  }

  // 页面初始化
  window.onload1 = async () => {
    console.log('桌面版页面加载启动...');
    
    try {

    }
  };

// 页面初始化（加强调试版）

    await loadImage(currentVol, currentPage);

    console.error('❌ 失败详情:', err.message || err);
  }
};
