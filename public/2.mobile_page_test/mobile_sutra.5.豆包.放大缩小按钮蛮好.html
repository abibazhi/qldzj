<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经 图片浏览</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      z-index: 10;
    }

    .error-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      z-index: 10;
      display: none;
    }

    .page-info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 10;
    }
    
    .controls {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
    }
    
    .control-btn {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="image-wrapper" id="imageWrapper">
    <img id="imageView" src="" alt="乾隆大藏经图片"/>
  </div>
  <div class="loading-indicator" id="loadingIndicator">加载中...</div>
  <div class="error-message" id="errorMessage">图片加载失败</div>
  <div class="page-info" id="pageInfo"></div>
  
  <!-- 添加控制按钮 -->
  <div class="controls">
    <button class="control-btn" id="zoomOutBtn">-</button>
    <button class="control-btn" id="resetBtn">1:1</button>
    <button class="control-btn" id="zoomInBtn">+</button>
  </div>
</div>

<script>
  function getQueryVariable(variable) {
    const query = window.location.search.substring(1);
    const vars = query.split('&');
    for (let i = 0; i < vars.length; i++) {
      const pair = vars[i].split('=');
      if (pair[0] === variable) return decodeURIComponent(pair[1]);
    }
    return false;
  }

  // 获取URL参数并验证
  const startParam = getQueryVariable('start') || '001001';
  const endParam = getQueryVariable('end') || '999999';
  
  // 验证参数格式
  const validateParam = (param) => /^\d{6}$/.test(param);
  
  if (!validateParam(startParam) || !validateParam(endParam)) {
    alert('URL参数格式错误，请使用6位数字格式（例如：?start=001001&end=001010）');
  }

  let currentVol = startParam.slice(0, 3);
  let currentPage = startParam.slice(3, 6);
  
  // 解析起始和结束范围
  const startVol = parseInt(startParam.slice(0, 3), 10);
  const startPage = parseInt(startParam.slice(3, 6), 10);
  const endVol = parseInt(endParam.slice(0, 3), 10);
  const endPage = parseInt(endParam.slice(3, 6), 10);

  // 缩放和拖拽相关变量
  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let lastScaleDistance = 0;
  let isLoading = false;
  let touchMode = null; // 'scale', 'swipe' 或 'drag'
  let startX = 0;
  let startY = 0;
  let startTranslateX = 0;
  let startTranslateY = 0;
  let startTime = 0;
  let scaleFactor = 1.05; // 缩放因子，控制缩放速度

  const imageWrapper = document.getElementById('imageWrapper');
  const imageView = document.getElementById('imageView');
  const loadingIndicator = document.getElementById('loadingIndicator');
  const errorMessage = document.getElementById('errorMessage');
  const pageInfo = document.getElementById('pageInfo');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const resetBtn = document.getElementById('resetBtn');

  function showLoading() {
    if (isLoading) return;
    isLoading = true;
    loadingIndicator.style.display = 'block';
    errorMessage.style.display = 'none';
  }

  function hideLoading() {
    isLoading = false;
    loadingIndicator.style.display = 'none';
  }

  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = 'block';
    setTimeout(() => {
      errorMessage.style.display = 'none';
    }, 3000);
  }

  function updatePageInfo() {
    pageInfo.textContent = `第 ${parseInt(currentVol)} 卷 第 ${parseInt(currentPage)} 页`;
  }

  // 更新图片变换
  function updateTransform() {
    imageWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  }

  function loadImage(vol, page) {
    return new Promise((resolve, reject) => {
      showLoading();
      
      // 更新页面信息
      updatePageInfo();

      const imgUrl = `/qldzj/${vol}/${page}.png`;

      imageView.onload = () => {
        // 图片加载完成后重置缩放和位置
        scale = 1;
        translateX = 0;
        translateY = 0;
        updateTransform();
        
        hideLoading();
        resolve();
      };

      imageView.onerror = (err) => {
        hideLoading();
        console.error('图片加载失败:', err);
        reject(new Error('图片加载失败，请尝试其他页面'));
      };

      imageView.src = imgUrl;
    });
  }

  async function changeImage(direction) {
    if (isLoading) return;
    
    let newVol = parseInt(currentVol, 10);
    let newPage = parseInt(currentPage, 10) + direction;
    
    // 计算新的卷号和页码
    if (direction > 0) {
      // 下一页逻辑
      if (newPage > 999) {
        newPage = 1;
        newVol += 1;
      }
    } else {
      // 上一页逻辑
      if (newPage < 1) {
        newPage = 999;
        newVol -= 1;
      }
    }
    
    // 验证新的卷号和页码是否超出范围
    if (newVol < startVol || (newVol === startVol && newPage < startPage)) {
      showError('已经是第一页');
      return;
    }
    
    if (newVol > endVol || (newVol === endVol && newPage > endPage)) {
      showError('已经是最后一页');
      return;
    }
    
    // 格式化为3位字符串
    const formattedVol = newVol.toString().padStart(3, '0');
    const formattedPage = newPage.toString().padStart(3, '0');

    try {
      // 保存当前状态，用于回滚
      const prevVol = currentVol;
      const prevPage = currentPage;
      
      // 更新当前状态
      currentVol = formattedVol;
      currentPage = formattedPage;
      
      // 尝试加载新图片
      await loadImage(currentVol, currentPage);
    } catch (err) {
      // 加载失败时回滚到之前的有效页面
      currentVol = prevVol;
      currentPage = prevPage;
      showError(err.message);
    }
  }

  // 缩放控制
  function zoomIn() {
    scale = Math.min(5, scale * scaleFactor);
    updateTransform();
  }

  function zoomOut() {
    scale = Math.max(1, scale / scaleFactor);
    if (scale <= 1.05) { // 接近原始大小时重置位置
      scale = 1;
      translateX = 0;
      translateY = 0;
    }
    updateTransform();
  }

  function resetView() {
    scale = 1;
    translateX = 0;
    translateY = 0;
    updateTransform();
  }

  // 触摸事件处理
  imageWrapper.addEventListener('touchstart', (event) => {
    if (event.touches.length === 2) {
      // 双指缩放
      touchMode = 'scale';
      const dx = event.touches[0].clientX - event.touches[1].clientX;
      const dy = event.touches[0].clientY - event.touches[1].clientY;
      lastScaleDistance = Math.sqrt(dx * dx + dy * dy);
    } else if (event.touches.length === 1) {
      // 检查当前缩放比例，确定是拖拽还是滑动
      if (scale > 1.0) {
        touchMode = 'drag';
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
        startTranslateX = translateX;
        startTranslateY = translateY;
      } else {
        touchMode = 'swipe';
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
        startTime = Date.now();
      }
    }
  });

  imageWrapper.addEventListener('touchmove', (event) => {
    if (touchMode === 'scale' && event.touches.length === 2) {
      // 防止滚动页面
      event.preventDefault();
      
      const dx = event.touches[0].clientX - event.touches[1].clientX;
      const dy = event.touches[0].clientY - event.touches[1].clientY;
      const currentDistance = Math.sqrt(dx * dx + dy * dy);
      
      // 使用缩放因子控制缩放速度
      const newScale = scale * (currentDistance / lastScaleDistance);
      scale = Math.max(1, newScale); // 最小缩放为1
      scale = Math.min(5, newScale); // 最大缩放为5
      
      updateTransform();
    } else if (touchMode === 'drag' && event.touches.length === 1) {
      // 防止滚动页面
      event.preventDefault();
      
      const currentX = event.touches[0].clientX;
      const currentY = event.touches[0].clientY;
      
      // 计算拖拽距离
      const deltaX = currentX - startX;
      const deltaY = currentY - startY;
      
      // 更新位置
      translateX = startTranslateX + deltaX;
      translateY = startTranslateY + deltaY;
      
      // 限制拖拽范围，确保图片不会完全移出屏幕
      const maxTranslateX = (scale - 1) * window.innerWidth / 2;
      const maxTranslateY = (scale - 1) * window.innerHeight / 2;
      
      translateX = Math.max(-maxTranslateX, Math.min(maxTranslateX, translateX));
      translateY = Math.max(-maxTranslateY, Math.min(maxTranslateY, translateY));
      
      updateTransform();
    } else if (touchMode === 'swipe' && event.touches.length === 1) {
      // 计算滑动距离
      const deltaX = event.touches[0].clientX - startX;
      const deltaY = event.touches[0].clientY - startY;
      
      // 如果滑动距离过大，可能是想滚动而不是翻页
      if (Math.abs(deltaY) > 50) {
        touchMode = null;
      }
    }
  });

  imageWrapper.addEventListener('touchend', (event) => {
    if (touchMode === 'swipe' && event.changedTouches.length === 1) {
      const endX = event.changedTouches[0].clientX;
      const endY = event.changedTouches[0].clientY;
      const deltaX = endX - startX;
      const deltaY = endY - startY;
      const duration = Date.now() - startTime;

      // 判断是否是有效的翻页手势
      if (Math.abs(deltaX) > 50 && Math.abs(deltaY) < 50 && duration < 500) {
        if (deltaX > 0) {
          changeImage(-1); // 向左滑动 ← 上一页
        } else {
          changeImage(1);  // 向右滑动 → 下一页
        }
      }
    }
    
    // 重置状态
    touchMode = null;
  });

  // 按钮事件监听
  zoomInBtn.addEventListener('click', zoomIn);
  zoomOutBtn.addEventListener('click', zoomOut);
  resetBtn.addEventListener('click', resetView);

  // 页面加载时加载初始图片
  window.onload = async () => {
    try {
      updatePageInfo();
      await loadImage(currentVol, currentPage);
    } catch (err) {
      showError('初始图片加载失败');
      console.error('初始图片加载失败:', err);
    }
  };
</script>

</body>
</html>
