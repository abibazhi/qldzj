<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经</title>
  <link rel="stylesheet" href="css/viewerControl.css">

  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <script type="module" src="./js/utils.js"></script>
  <script type="module" src="./js/pageNav.js"></script>
  <script type="module" src="./js/imageLoader.js"></script>
  <script type="module" src="./js/sutraInfo.js"></script>
  <script src="js/tongji.baidu.js"></script>

  <style>

    /* --------------------------
     🔥 图片大小 & 位置 【你自己改这里】
     -------------------------- */
body {
  margin: 0;
  padding: 0;
  overflow: hidden; /* 确保 body 不会出现滚动条 */
}

/* 在 mobile_sutra.html 中 */
.image-wrapper {
  /* 不要改成 block，保留 viewerControl.css 中的 flex 居中 */
  /* 用 padding-top 给标题栏留空间是可以的，但不要加 !important */
  padding-top: 10px; 
}

#imageView {
  /* 删除 width: 120% !important; */
  /* 让 viewerControl.css 中的 max-width: 100%; 生效即可 */
  opacity: 0;
  transition: opacity 0.3s ease-in;
}


#imageView.loaded {
  opacity: 1;
}

/* 顶部信息栏 - 完全透明 */
.top-info-bar {
  position: fixed;
  top: 10px;
  left: 0;
  right: 0;
  background: transparent;
  padding: 12px 16px;
  z-index: 999;
  text-align: center;
  pointer-events: none;
}

.sutra-title {
  font-size: clamp(14px, 5vw, 20px);
  font-weight: 500;
  color: #000;
  letter-spacing: 1px;
  white-space: normal;        /* 允许换行 */
  word-break: break-word;     /* 长单词换行 */
  max-width: 90vw;
  display: block;
  margin: 0 auto;
}

.roll-title {
  font-size: clamp(11px, 4vw, 14px);
  color: #333;
  margin-top: 4px;
  white-space: normal;        /* 允许换行 */
  word-break: break-word;
  max-width: 90vw;
  display: block;
  margin: 4px auto 0;
}

/* 三源全部失败时的重试浮层 */
.retry-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.35);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9000;
}
.retry-overlay.show { display: flex; }
.retry-box {
  background: #fff;
  border-radius: 10px;
  padding: 22px 28px;
  text-align: center;
  box-shadow: 0 6px 24px rgba(0,0,0,0.25);
  max-width: 78vw;
}
.retry-msg {
  font-size: 14px;
  color: #333;
  margin-bottom: 14px;
  line-height: 1.6;
}
.retry-btn {
  background: #2d7dd2;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 10px 36px;
  font-size: 15px;
  cursor: pointer;
}
.retry-btn:active { opacity: 0.85; }
  </style>
</head>
<body>

<div class="container">
  <!-- 顶部信息栏 -->
  <div class="top-info-bar">
    <div id="sutraTitle" class="sutra-title">乾隆大藏经</div>
    <div id="rollTitle" class="roll-title"></div>
  </div>

  <div class="image-wrapper" id="imageWrapper">
    <img id="imageView" src="" alt="经文图片">
  </div>

  <div class="loading-indicator" id="loadingIndicator">加载中...</div>
  <div class="error-message" id="errorMessage">加载失败</div>
  <div class="page-info" id="pageInfo"></div>
  <div class="source-badge" id="sourceBadge">---</div>

  <div class="retry-overlay" id="retryOverlay">
    <div class="retry-box">
      <div class="retry-msg" id="retryMsg">图片加载失败</div>
      <button class="retry-btn" id="retryBtn">重试</button>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn" id="zoomOutBtn">-</button>
    <button class="control-btn" id="resetBtn">1:1</button>
    <button class="control-btn" id="zoomInBtn">+</button>
  </div>
</div>

<div id="floatTip" style="position:fixed;top:30px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:8px 20px;border-radius:4px;z-index:10000;display:none;"></div>

<script type="module">
import { currentVol, currentPage, calcNextPage, setCurrentPage } from './js/pageNav.js';
import { getBestImageUrl, isColorImage, onMappingLoading } from './js/imageLoader.js';
import { fetchSutraInfo, getRollTitle } from './js/sutraInfo.js';

let isLoading = false;
let startX = 0;
let panzoom = null;
let currentSutraInfo = null;

const imageWrapper = document.getElementById('imageWrapper');
const imageView = document.getElementById('imageView');
const loadingIndicator = document.getElementById('loadingIndicator');
const pageInfo = document.getElementById('pageInfo');
const sourceBadge = document.getElementById('sourceBadge');
const floatTip = document.getElementById('floatTip');
const sutraTitleElem = document.getElementById('sutraTitle');
const rollTitleElem = document.getElementById('rollTitle');
const retryOverlay = document.getElementById('retryOverlay');
const retryMsg = document.getElementById('retryMsg');
const retryBtn = document.getElementById('retryBtn');

function showRetry(msg) {
  retryMsg.textContent = msg;
  retryOverlay.classList.add('show');
}
function hideRetry() {
  retryOverlay.classList.remove('show');
}

retryBtn.onclick = () => {
  if (isLoading) return;
  loadImage(currentVol, currentPage);
};

function showTempTip(msg) {
  floatTip.textContent = msg;
  floatTip.style.display = 'block';
  setTimeout(() => floatTip.style.display = 'none', 2000);
}

// 初始化手势
function initPanzoom() {
  panzoom = Panzoom(imageWrapper, {
    maxScale: 5,
    minScale: 1,
    step: 0.15,
    cursor: 'grab',
    pinchAndZoom: true,
  });
  imageWrapper.addEventListener('wheel', panzoom.zoomWithWheel);
}

// 加载 & 翻页
function showLoading(vol, page) {
  isLoading = true;
  const color = isColorImage(vol, page);
  loadingIndicator.textContent = color
    ? '⏳ 彩色大图加载中（约1~3MB），请稍候…'
    : '加载中...';
  loadingIndicator.style.display = 'block';
  hideRetry();
}
function hideLoading() { isLoading = false; loadingIndicator.style.display = 'none'; }
function updatePageInfo() { pageInfo.textContent = `第 ${currentVol} 册 第 ${currentPage} 页`; }

// 更新顶部信息
function updateTopInfo(title, rollName) {
    if (title) {
        sutraTitleElem.textContent = `乾隆大藏经 · ${title}`;
    }
    if (rollName !== undefined) {
        rollTitleElem.textContent = rollName;
    }
}

// 加载经卷信息
async function loadSutraInfo1() {
    const urlParams = new URLSearchParams(window.location.search);
    const sutraNum = urlParams.get('sutra');
    const currentIdx = urlParams.get('idx');
    
    if (!sutraNum) return;
    
    const info = await fetchSutraInfo(sutraNum);
    if (!info) return;
    
    currentSutraInfo = info;
    const rollName = getRollTitle(info.rolls, currentIdx);
    updateTopInfo(info.title, rollName);
}

// 加载经卷信息
async function loadSutraInfo() {
    const urlParams = new URLSearchParams(window.location.search);
    const sutraNum = urlParams.get('sutra');
    const currentIdx = urlParams.get('idx');

    if (!sutraNum) return;

    const info = await fetchSutraInfo(sutraNum);
    if (!info) return;

    currentSutraInfo = info;
    
    // 处理单卷经的情况（没有 idx 参数）
    if (!currentIdx && info.rollName) {
        // 单卷经：显示卷名
        updateTopInfo(info.title, info.rollName);
    } else {
        // 多卷经：根据 idx 获取卷名
        const rollName = getRollTitle(info.rolls, currentIdx);
        updateTopInfo(info.title, rollName);
    }
}


// 翻页后更新卷名
async function updateRollAfterPageChange(newVol, newPage) {
    if (!currentSutraInfo || !currentSutraInfo.rolls || currentSutraInfo.rolls.length === 0) return;
    
    // 构造当前页码的数值（用于比较）
    const pagePadded = String(newPage).padStart(3, '0');
    const volPadded = String(newVol).padStart(3, '0');
    const currentPageNum = parseInt(volPadded + pagePadded, 10);
    
    // 卷列表按 idx 升序排列，找到最后一个起始页 小于等于 当前页码的卷
    let currentRoll = null;
    for (const roll of currentSutraInfo.rolls) {
        const rollStartNum = parseInt(roll.i, 10);
        if (rollStartNum <= currentPageNum) {
            currentRoll = roll;
        } else {
            break;
        }
    }
    
    if (currentRoll) {
        rollTitleElem.textContent = currentRoll.t;
    } else {
        rollTitleElem.textContent = '';
    }
}



async function loadImage(vol, page) {
  showLoading(vol, page);
  try {
    const best = await getBestImageUrl(vol, page);
    if (best) {
      // 先移除 loaded 类（变透明）
      imageView.classList.remove('loaded');
      
      // 设置新图片
      imageView.src = best.url;
      
      // 图片加载完成后添加 loaded 类（淡入）
      imageView.onload = () => {
        imageView.classList.add('loaded');
      };
      
      // 图片加载失败的处理
      imageView.onerror = () => {
        imageView.classList.remove('loaded');
        showTempTip("加载失败");
      };
      
      sourceBadge.textContent = best.key;
    } else {
      showRetry('图片加载失败：三个图源均不可用，请检查网络后重试。');
    }
  } catch (e) {
    console.error(e);
    showRetry('加载异常，请点击重试。');
  }
  hideLoading();
}


async function changeImage(direction) {
  if (isLoading) return;
  const res = await calcNextPage(direction);

  //if (!res.ok) return showTempTip(direction > 0 ? "已经是最后一页" : "已经是第一页");
  if (!res.ok) {
    // 已经是边界，显示提示并重置位置
    showTempTip(direction > 0 ? "已经是最后一页" : "已经是第一页");
    
    // 重置缩放和位置到初始状态
    if (panzoom) panzoom.reset();  // 回到 1:1 和居中位置
    
    return;
  }  
  
  const { newVol, newPage } = res;
  await loadImage(newVol, newPage);
  setCurrentPage(newVol, newPage);
  updatePageInfo();
  if (panzoom) panzoom.reset();

  // 传入新的册和页
  await updateRollAfterPageChange(newVol, newPage);

}

// 按钮
document.getElementById('zoomInBtn').onclick = () => { if (panzoom) panzoom.zoomIn(); };
document.getElementById('zoomOutBtn').onclick = () => { if (panzoom) panzoom.zoomOut(); };
document.getElementById('resetBtn').onclick = () => { if (panzoom) panzoom.reset(); };

// --------------------------
// ✅ 【完美翻页逻辑】
// 只有 1:1 才能翻页，放大时绝不翻页
// --------------------------
imageWrapper.addEventListener('touchstart', e => {
  if (!panzoom || panzoom.getScale() === 1) {
    startX = e.touches[0].clientX;
  }
});

imageWrapper.addEventListener('touchend', e => {
  if (!panzoom) return;
  const scale = panzoom.getScale();
  if (scale !== 1) return;

  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 50) {
    changeImage(dx > 0 ? -1 : 1);
  }
});

window.onload = async () => {
  try { initPanzoom(); } catch (e) { console.warn('Panzoom 初始化失败:', e); }
  updatePageInfo();

  // mapping 加载期间提示初始化数据（getBestImageUrl 内部会 await mapping，
  // 因此 loadImage 完成前该提示自然覆盖初始化阶段）
  onMappingLoading(loading => {
    if (loading) {
      loadingIndicator.textContent = '⏳ 正在加载初始化数据，请稍后...';
      loadingIndicator.style.display = 'block';
    }
  });

  try { await loadSutraInfo(); } catch (e) { console.warn('经卷信息加载失败:', e); }
  await loadImage(currentVol, currentPage);
};
</script>
</body>
</html>
