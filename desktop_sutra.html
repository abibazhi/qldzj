<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经图片浏览</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .container {
      width: 100vw;
      height: 100vh;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: transparent;
      padding: 10px;
      box-shadow: 0 0 0 5px silver;
      box-sizing: border-box;
      touch-action: pan-x pan-y;
      transition: transform 0.3s ease-in-out;
      position: relative;
    }

    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
    }

    .source-badge {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #0f0;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      z-index: 100;
      pointer-events: none;
    }

    /* 桌面版缩放工具栏 */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 999;
    }
    .control-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }
  </style>

  <script type="module" src="./js/utils.js"></script>
  <script type="module" src="./js/pageNav.js"></script>
  <script type="module" src="./js/imageLoader.js"></script>
  <script type="module" src="./js/viewerControl.js"></script>

<script>

  hm.src = "https://hm.baidu.com/hm.js?7784bc9ab299071f3a78b249954402c8";

</script>
</head>
<body>

<div id="imageContainer" class="container">
  <div id="loadingIndicator" class="loading-indicator">加载中...</div>
  <div id="sourceBadge" class="source-badge">---</div>
</div>

<!-- 桌面版缩放工具栏 -->
<div class="controls">
  <button class="control-btn" id="zoomOutBtn">-</button>
  <button class="control-btn" id="resetBtn">1:1</button>
  <button class="control-btn" id="zoomInBtn">+</button>
</div>

<script type="module">
import { getBestImageUrl } from './js/imageLoader.js'
import { currentVol, currentPage, calcNextPage, setCurrentPage } from './js/pageNav.js';
import { zoomIn, zoomOut, resetView, isZoomed, getTransform } from './js/viewerControl.js';

let zoomed = false;
let isLoading = false;

const edgeThreshold = 0.05;
const container = document.getElementById('imageContainer');
const loadingIndicator = document.getElementById('loadingIndicator');
const sourceBadge = document.getElementById('sourceBadge');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const resetBtn = document.getElementById('resetBtn');

function showLoading() {
  if (isLoading) return;
  isLoading = true;
  loadingIndicator.style.display = 'block';
}

function hideLoading() {
  isLoading = false;
  loadingIndicator.style.display = 'none';
}

async function loadImage(vol, page) {
  showLoading();
  try {
    const best = await getBestImageUrl(vol, page);
    if (best) {
      container.style.backgroundImage = `url(${best.url})`;
      sourceBadge.textContent = best.key;
    } else {
      container.style.backgroundImage = "none";
      container.style.backgroundColor = "#222";
      sourceBadge.textContent = "失败";
    }
  } catch (e) {
    console.error(e);
  }
  hideLoading();
}

async function changeImage(direction) {
  if (isZoomed() || isLoading) {
    console.log("❌ 缩放中 或 加载中，禁止翻页");
    return;
  }
  const res = calcNextPage(direction);
  if (!res.ok) return;
  const { newVol, newPage } = res;
  await loadImage(newVol, newPage);
  setCurrentPage(newVol, newPage);
}

function updateCursor(event) {
  const rect = event.target.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  const width = rect.width;
  const height = rect.height;

  const isTopEdge = y < height * edgeThreshold;
  const isBottomEdge = y > height * (1 - edgeThreshold);
  const isLeftEdge = x < width * edgeThreshold;
  const isRightEdge = x > width * (1 - edgeThreshold);

  if (isTopEdge || isBottomEdge || isLeftEdge || isRightEdge) {
    container.style.cursor = 'pointer';
  } else {
    container.style.cursor = 'auto';
  }
}

container.addEventListener('mousemove', updateCursor);
container.addEventListener('mouseleave', () => {
  container.style.cursor = 'auto';
});

container.addEventListener('click', (event) => {
  const rect = event.target.getBoundingClientRect();
  const clickX = event.clientX - rect.left;
  const width = rect.width;
  const isLeftEdge = clickX < width * edgeThreshold;
  const isRightEdge = clickX > width * (1 - edgeThreshold);

  if (isLeftEdge) {
    changeImage(-1);
  } else if (isRightEdge) {
    changeImage(1);
  }
});

// 双击放大（保留原有逻辑）
container.addEventListener('dblclick', handleDoubleClick);
function handleDoubleClick(event) {
  if (isLoading) return;
  if (isZoomed()) {
    resetView(container);
    return;
  }
  zoomIn(container);
}

// 工具栏按钮
zoomInBtn.addEventListener('click', () => zoomIn(container));
zoomOutBtn.addEventListener('click', () => zoomOut(container));
resetBtn.addEventListener('click', () => resetView(container));

window.onload = async () => {
  console.log('✅ 桌面版加载');
  await loadImage(currentVol, currentPage);
};
</script>

</body>
</html>
