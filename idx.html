    /* 校对标记开关：循环切换 关 → 多经同卷 → 单页经 */

        margin-left: 12px;
        padding: 1px 10px;
        font-size: 0.9em;

    body.mark-multi tr[data-first] td { font-weight: 700; }
    body.mark-multi tr[data-first] td:first-child { border-left: 4px solid #e0a800; }
    body.mark-single tr[data-single] { background-color: #cfe8ff; }
    </style>

<body>

            <span id="quickJumpLinks"></span>

        <table border="1" class="dataframe" id="sutraTable">
        </table>

<!-- 底部信息栏 -->
<footer class="footer-info">

<!-- 移除了 controls 属性，音乐播放器被隐藏 -->
<audio id="bgMusic" src="https://img.daxumi.top/%E5%8D%97%E6%97%A0%E8%8D%AF%E5%B8%88%E7%90%89%E7%92%83%E5%85%89%E5%A6%82%E6%9D%A5.mp3" preload="auto" loop muted fetchpriority="low"></audio>

<script>
  const audio = document.getElementById('bgMusic');
  const btn = document.getElementById('musicBtn');

  // 页面加载后，尝试静音自动播放（现代浏览器允许）
  window.addEventListener('load', () => {
    audio.play().catch(() => {
      // 如果自动播放被阻止，可以忽略或做其他处理
    });
  });

  // 点击按钮切换播放/暂停和图标
  btn.addEventListener('click', () => {
    if (audio.muted) {
      audio.muted = false;
      audio.play();
      btn.textContent = '🔊'; // 有声状态
    } else {
      audio.muted = true;
      btn.textContent = '🔇'; // 静音状态
    }
  });
</script>


    <!-- ⭐ 所有逻辑都在这个 type="module" 脚本中 -->
    <script type="module">
    // 数据来源：data/cache/（gen_cache.mjs 从真源生成，浏览器不加载真源主表）
    const [sutraLinks, categoryMap, multiVol] = await Promise.all([
        fetch('./data/cache/sutras.json').then(r => r.json()),
        fetch('./data/cache/category_map.json').then(r => r.json()),
        // 多经同卷分组（校对开关用）；加载失败降级为空，单页经标记不受影响
        fetch('./data/cache/multi_vol.json').then(r => r.json()).catch(() => ({ firsts: [], members: [] }))
    ]);

    'use strict';

    // 多经同卷分组：members=组内全部经号，firsts=首部经号
    const multiSet = new Set(multiVol.members);
    const firstSet = new Set(multiVol.firsts);

    /**
     * 生成快速跳转链接（数据来自 categoryMap）
     */
    const quickJumpLinks = document.getElementById('quickJumpLinks');
    if (quickJumpLinks) {
        quickJumpLinks.innerHTML = Object.entries(categoryMap)
            .map(([num, name]) => `<a href="#anchor_${num}">${name}</a>`)
            .join(' | ');
    }

    /**
     * 将 "册-页" 格式转为6位数字 (册3位+页3位)
     */
    function padStartEnd(display) {
        const parts = display.split('-');
        const volume = parseInt(parts[0], 10);
        const page = parseInt(parts[1], 10);
        return String(volume).padStart(3, '0') + String(page).padStart(3, '0');
    }

    /**
     * 生成单行 HTML（导航统一：标题链接进阅读页，其后图形链接进卷索引页）
     */
    function buildRow(sutra, start, end, title, translator) {
        const startPadded = padStartEnd(start);
        const endPadded = padStartEnd(end);
        const readHref = 'public/sutra.html?start=' + startPadded + '&end=' + endPadded + '&sutra=' + sutra;
        const idxHref = 'public/sutra' + sutra + '.idx.html';

        // 译者：分号转 <br>
        const translatorHtml = translator.replace(/；/g, '<br>');

        // 经号 0（首条大清三藏圣教目录）与空经号（末条勘误表）不显示编号，保留空白
        const numText = (sutra === 0 || sutra === '') ? '' : sutra;

        // 非数字经号（勘误表）无卷信息，只给阅读链接；其余经统一双链接
        const idxLink = (sutra === '') ? '' :
            '<a href="' + idxHref + '" class="idx-link" title="卷索引">☰</a>';

        // 校对标记：多经同卷 / 首部经 / 单页经（start=end），由顶部按钮切换显示
        let marks = '';
        if (typeof sutra === 'number') {
            if (multiSet.has(sutra)) marks += ' data-multi="1"';
            if (firstSet.has(sutra)) marks += ' data-first="1"';
            if (start === end) marks += ' data-single="1"';
        }

        return '<tr' + marks + '>\n' +
            '            <td>' + numText + '</td>\n' +
            '            <td><a href="' + readHref + '">' + title + '</a>' + idxLink + '</td>\n' +
            '            <td>' + translatorHtml + '</td>\n' +
            '        </tr>';
    }

    /**
     * 构建分类标题行
     */
    function buildCategoryRow(sutra, categoryName) {
        return '<tr id="anchor_' + sutra + '">\n' +
            '            <td></td>\n' +
            '            <td colspan="2"><strong>' + categoryName + '</strong></td>\n' +
            '        </tr>';
    }

    // ============================================================
    // 主逻辑：生成表格
    // ============================================================

    const table = document.getElementById('sutraTable');
    if (!table) {
        console.error('❌ 找不到表格元素 #sutraTable');
        throw new Error('表格元素不存在');
    }

    const htmlRows = [];
    const insertedCategories = {};

    for (let i = 0; i < sutraLinks.length; i++) {
        const row = sutraLinks[i];
        const sutra = row[0];
        const start = row[1];
        const end = row[2];
        // 经名 = 简体经名 + 别名（row[5]=alias，与首页 gen_index.mjs 一致；勘误表等无 alias 时兜底 ''）
        const title = row[3] + (row[5] || '');
        const translator = row[4];

        // 检查是否应该插入分类标题
        if (categoryMap[sutra] !== undefined && !insertedCategories[sutra]) {
            htmlRows.push(buildCategoryRow(sutra, categoryMap[sutra]));
            insertedCategories[sutra] = true;
        }

        // 生成数据行
        htmlRows.push(buildRow(sutra, start, end, title, translator));
    }

    // 填入表格
    table.innerHTML = htmlRows.join('\n');

    console.log('✅ 表格生成完成，共 ' + sutraLinks.length + ' 行');

    // ============================================================
    // 给每部经加上 id，以便跳转
    // ============================================================
    const rows = document.querySelectorAll('table tr');
    rows.forEach(function(row) {
        const firstTd = row.querySelector('td:first-child');
        if (firstTd) {
            const text = firstTd.textContent.trim();
            if (/^\d+$/.test(text)) {
                firstTd.id = 'sutra' + text;
            }
        }
    });

    // ============================================================
    // 校对标记开关：关 → 多经同卷 → 单页经 循环（纯 CSS 类切换，不重建表格）
    // 模式存入 localStorage，回退/刷新/再次打开均自动恢复
    // ============================================================
    const MARK_MODES = [
        { cls: '', label: '标记: 关' },
        { cls: 'mark-multi', label: '标记: 多经同卷' },
        { cls: 'mark-single', label: '标记: 单页经' }
    ];
    const MARK_KEY = 'idxMarkMode';
    const markBtn = document.getElementById('markToggle');
    let markIdx = 0;
    try {
        const saved = parseInt(localStorage.getItem(MARK_KEY), 10);
        if (saved >= 0 && saved < MARK_MODES.length) markIdx = saved;
    } catch (e) {}
    function applyMarkMode() {
        document.body.classList.remove('mark-multi', 'mark-single');
        const mode = MARK_MODES[markIdx];
        if (mode.cls) document.body.classList.add(mode.cls);
        markBtn.textContent = mode.label;
    }
    markBtn.addEventListener('click', function() {
        markIdx = (markIdx + 1) % MARK_MODES.length;
        try { localStorage.setItem(MARK_KEY, String(markIdx)); } catch (e) {}
        applyMarkMode();
    });
    applyMarkMode();
    </script>

    <script>
    // 异步预加载全量映射数据（仅入 HTTP 缓存，不解析，避免阻塞渲染）
    const preloadMapping = () => fetch('./js/mapping.json').catch(() => {});
    if ('requestIdleCallback' in window) requestIdleCallback(preloadMapping);
    else setTimeout(preloadMapping, 3000);
    </script>

</body>
