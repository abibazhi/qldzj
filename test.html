<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>图源在线状态测试台</title>
  <style>
    body{font-family:Arial;padding:20px;background:#111;color:#fff}
    .test-box{max-width:700px;margin:0 auto}
    .input-line{margin:10px 0;display:flex;gap:10px}
    input{padding:8px;width:100px;font-size:16px}
    button{padding:8px 16px;background:#09c;color:#fff;border:0;border-radius:4px;cursor:pointer}
    .result{margin-top:20px;display:flex;flex-direction:column;gap:12px}
    .item{padding:12px;border-radius:6px;background:#222}
    .item.ok{background:#043A2B}
    .item.no{background:#440000}
    .url{font-size:12px;color:#aaa;margin-top:4px;word-break:break-all}
    img{max-width:100%;max-height:300px;margin-top:10px;border-radius:6px}
    .status-panel{position:fixed;top:10px;right:10px;background:#222;padding:10px;border-radius:6px;font-size:12px}
  </style>
</head>
<body>

<div class="test-box">
  <h2>📊 图源在线状态测试台（安全独立版）</h2>

  <div class="input-line">
    卷 <input type="text" id="vol" value="001">
    页 <input type="text" id="page" value="1">
    <button onclick="startTest()">测试所有图源</button>
  </div>

  <div id="result" class="result"></div>
</div>

<div class="status-panel" id="statusPanel">等待测试...</div>

<script>
// ==========================
// 未来要拆分出去的 image-source.js 逻辑
// ==========================
function buildSources(vol, page) {
  const vol3 = String(vol).padStart(3, '0');
  const pageNum = parseInt(page, 10);

  return [
    {
      key: "R2",
      url: `https://pub-a0fc4de2782d448f916244913768fb78.r2.dev/${vol3}/${pageNum}.png`
    },
    {
      key: "GitHub绝对",
      url: `https://abibazhi.github.io/${vol3}/${pageNum}.png`
    },
    {
      key: "GitHub相对",
      url: `/${vol3}/${pageNum}.png`
    }
  ];
}

// 测试图片是否可访问
function testImage(url) {
  return new Promise(resolve => {
    const img = new Image();
    const timer = setTimeout(() => resolve(false), 5000);
    img.onload = () => { clearTimeout(timer); resolve(true); };
    img.onerror = () => { clearTimeout(timer); resolve(false); };
    if (url.startsWith("http")) img.crossOrigin = "anonymous";
    img.src = url;
  });
}

// 执行测试
async function startTest() {
  const vol = document.getElementById('vol').value;
  const page = document.getElementById('page').value;
  const res = document.getElementById('result');
  res.innerHTML = "测试中...";

  const list = buildSources(vol, page);
  let output = "";
  let status = {};

  for (const item of list) {
    const ok = await testImage(item.url);
    status[item.key] = ok ? "✅" : "❌";

    output += `
      <div class="item ${ok ? 'ok' : 'no'}">
        ${item.key}：${ok ? "✅ 正常" : "❌ 失败"}
        <div class="url">${item.url}</div>
        ${ok ? `<img src="${item.url}">` : ""}
      </div>
    `;
  }

  res.innerHTML = output;
  updateStatus(status);
}

function updateStatus(status) {
  const panel = document.getElementById('statusPanel');
  panel.innerHTML = `
    R2: ${status.R2}<br>
    GitHub绝对: ${status["GitHub绝对"]}<br>
    GitHub相对: ${status["GitHub相对"]}
  `;
}
</script>

</body>
</html>
