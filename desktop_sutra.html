<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />

  <title>乾隆大藏经图片浏览</title>
  <script src="qldzj/mapping.js?v=1"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .container {
      width: 100vw;
      height: 100vh;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: transparent;
      padding: 10px;
      box-shadow: 0 0 0 5px silver;
      box-sizing: border-box;
      touch-action: pan-x pan-y;
      transition: transform 0.3s ease-in-out;
      position: relative;
    }

    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
    }

    .source-badge {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #0f0;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      z-index: 100;
      pointer-events: none;
    }
  </style>

<body>

<div id="imageContainer" class="container">
  <div id="loadingIndicator" class="loading-indicator">加载中...</div>
  <div id="sourceBadge" class="source-badge">---</div>
</div>

<script>
  // ========== 配置区域 ==========
  // 加载策略: 'local' (仅本地), 'imgbb' (仅远程), 'fallback' (远程优先，失败回退本地)
  let LOAD_STRATEGY = 'fallback';  // 优先 ImgBB，失败回退本地
  let urlMapping = null;           // 存储映射表
  urlMapping = mappingData;
  let currentSource = 'local';     // 当前图片来源
  // =============================

  function getQueryVariable(variable) {
    const query = window.location.search.substring(1);
    const vars = query.split('&');
    for (let i = 0; i < vars.length; i++) {
      const pair = vars[i].split('=');
      if (pair[0] === variable) return decodeURIComponent(pair[1]);
    }
    return false;
  }

  const startParam = getQueryVariable('start') || '001001';
  const endParam = getQueryVariable('end') || '999999';

  // 检测参数长度并相应分割
  function splitVolumeAndPage(param) {
    const len = param.length;
    let vol, page;

    if (len === 6) {
      vol = param.slice(0, 3);
      page = param.slice(3, 6);
    } else if (len === 7) {
      vol = param.slice(0, 3);
      page = param.slice(3, 7);
    } else {
      vol = param.slice(0, 3);
      page = param.slice(3);
    }

    return { vol, page };
  }

  const start = splitVolumeAndPage(startParam);
  const end = splitVolumeAndPage(endParam);

  const startVol = start.vol;
  const startPage = start.page;
  const endVol = end.vol;
  const endPage = end.page;

  let currentPage = startPage;
  let currentVol = startVol;
  let zoomed = false;
  let isLoading = false;

  const edgeThreshold = 0.05;
  const container = document.getElementById('imageContainer');
  const loadingIndicator = document.getElementById('loadingIndicator');
  const sourceBadge = document.getElementById('sourceBadge');

  function showLoading() {
    if (isLoading) return;
    isLoading = true;
    loadingIndicator.style.display = 'block';
  }

  function hideLoading() {
    isLoading = false;
    loadingIndicator.style.display = 'none';
  }

  // 获取本地图片路径
  function getLocalImageUrl(vol, page) {
    const pageNum = parseInt(page, 10);
    return `/qldzj/pngs/${vol}/${pageNum}.png`;
  }

  // 获取 ImgBB 图片路径（适配只存随机ID的 mapping.json）
  function getImgbbrl(vol, page) {
    if (!urlMapping) return null;
    const key = `${vol}_${parseInt(page, 10)}`;
    const randomId = urlMapping[key];
    if (!randomId) return null;
    
    // 拼接完整 URL
    const pageNum = parseInt(page, 10);
    const filename = `${vol}-${pageNum}-png.png`;
    return `https://i.ibb.co/${randomId}/${filename}`;
  }

  // 加载映射表
  /*
  async function loadMapping() {
    if (LOAD_STRATEGY === 'local') return;

    try {
      console.log('正在加载 /mapping.json...');
      const response = await fetch('/qldzj/mapping.json?v=1');
      if (response.ok) {
        urlMapping = await response.json();
        console.log(`✅ 加载映射表成功，共 ${Object.keys(urlMapping).length} 条记录`);
      } else {
        console.warn('⚠️ 映射表加载失败，将只使用本地图片');
        LOAD_STRATEGY = 'local';
      }
    } catch (err) {
      console.warn('⚠️ 映射表加载异常:', err);
      LOAD_STRATEGY = 'local';
    }
  }
  */

  // 尝试加载单张图片
  function tryLoadImage(url) {
    return new Promise((resolve) => {
      const img = new Image();
      const timeout = setTimeout(() => {
        img.onload = null;
        img.onerror = null;
        resolve({ success: false, error: 'timeout' });
      }, 10000);

      img.onload = () => {
        clearTimeout(timeout);
        resolve({ success: true, img: img });
      };

      img.onerror = () => {
        clearTimeout(timeout);
        resolve({ success: false, error: 'load error' });
      };

      img.src = url;
    });
  }

  // 带回退的图片加载
  async function loadImage(vol, page) {
    showLoading();

    const strategies = [];

    if (LOAD_STRATEGY === 'fallback') {
      strategies.push({ type: 'imgbb', url: getImgbbrl(vol, page) });
      strategies.push({ type: 'local', url: getLocalImageUrl(vol, page) });
    } else if (LOAD_STRATEGY === 'imgbb') {
      strategies.push({ type: 'imgbb', url: getImgbbrl(vol, page) });
    } else {
      strategies.push({ type: 'local', url: getLocalImageUrl(vol, page) });
    }

    for (const strategy of strategies) {
      if (!strategy.url) continue;

      try {
        const result = await tryLoadImage(strategy.url);
        if (result.success) {
          container.style.backgroundImage = `url(${strategy.url})`;
          currentSource = strategy.type === 'imgbb' ? 'ImgBB' : '本地';
          sourceBadge.textContent = currentSource;
          sourceBadge.style.color = strategy.type === 'imgbb' ? '#0f0' : '#ff0';
          hideLoading();
          return;
        }
        console.warn(`${strategy.type} 加载失败: ${strategy.url}`);
      } catch (err) {
        console.warn(`${strategy.type} 加载异常:`, err);
      }
    }

    hideLoading();
    console.error('所有图片来源均加载失败');
    // 可选：显示错误提示
    container.style.backgroundColor = '#333';
    container.style.backgroundImage = 'none';
  }

  async function changeImage(direction) {
    if (zoomed || isLoading) return;

    let currentPageNum = parseInt(currentPage, 10);
    let currentVolNum = parseInt(currentVol, 10);
    let startPageNum = parseInt(startPage, 10);
    let startVolNum = parseInt(startVol, 10);
    let endPageNum = parseInt(endPage, 10);
    let endVolNum = parseInt(endVol, 10);

    let newPage = currentPageNum + direction;
    let newVol = currentVolNum;

    if (direction > 0) {
      const maxPage = currentPage.length === 4 ? 9999 : 999;
      if (newPage > maxPage) {
        newPage = 1;
        newVol += 1;
      }
    } else {
      if (newPage < 1) {
        if (currentPageNum === 1) {
          return;
        } else {
          const maxPage = currentPage.length === 4 ? 9999 : 999;
          newPage = maxPage;
          newVol -= 1;
        }
      }
    }

    newVol = newVol.toString().padStart(3, '0');
    if (currentPage.length === 4) {
      newPage = newPage.toString().padStart(4, '0');
    } else {
      newPage = newPage.toString().padStart(3, '0');
    }

    if (
      (parseInt(newVol, 10) < startVolNum) ||
      (parseInt(newVol, 10) === startVolNum && parseInt(newPage, 10) < startPageNum) ||
      (parseInt(newVol, 10) > endVolNum) ||
      (parseInt(newVol, 10) === endVolNum && parseInt(newPage, 10) > endPageNum)
    ) {
      return;
    }

    try {
      await loadImage(newVol, newPage);
      currentPage = newPage;
      currentVol = newVol;
    } catch (err) {
      console.error('图片加载失败:', err);
    }
  }

  function updateCursor(event) {
    const rect = event.target.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    const width = rect.width;
    const height = rect.height;

    const isTopEdge = y < height * edgeThreshold;
    const isBottomEdge = y > height * (1 - edgeThreshold);
    const isLeftEdge = x < width * edgeThreshold;
    const isRightEdge = x > width * (1 - edgeThreshold);

    if (isTopEdge || isBottomEdge || isLeftEdge || isRightEdge) {
      container.style.cursor = 'pointer';
    } else {
      container.style.cursor = 'auto';
    }
  }

  container.addEventListener('mousemove', updateCursor);
  container.addEventListener('mouseleave', () => {
    container.style.cursor = 'auto';
  });

  container.addEventListener('click', (event) => {
    if (isLoading) return;

    const rect = event.target.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const width = rect.width;

    const isLeftEdge = clickX < width * edgeThreshold;
    const isRightEdge = clickX > width * (1 - edgeThreshold);

    if (isLeftEdge) {
      changeImage(-1);
    } else if (isRightEdge) {
      changeImage(1);
    }
  });

  container.addEventListener('dblclick', handleDoubleClick);

  function handleDoubleClick(event) {
    if (isLoading) return;

    if (zoomed) {
      zoomOut();
      return;
    }

    const rect = container.getBoundingClientRect();
    const y = event.clientY - rect.top;
    const height = rect.height;

    const isTopEdge = y < height * 0.05;
    const isBottomEdge = y > height * 0.95;

    if (isTopEdge) {
      zoomToPosition(0, 'top');
    } else if (isBottomEdge) {
      zoomToPosition(0, 'bottom');
    }
  }

  function zoomToPosition(clickX, position) {
    const scale = 2.4;
    let transformOriginY = 'center';

    if (position === 'top') {
      transformOriginY = '11.8%';
    } else if (position === 'bottom') {
      transformOriginY = '80%';
    }

    container.style.transformOrigin = `50% ${transformOriginY}`;
    container.style.transform = `scale(${scale})`;
    container.style.backgroundSize = 'contain';
    container.style.backgroundPosition = 'center';

    zoomed = true;
  }

  function zoomOut() {
    container.style.transformOrigin = 'center';
    container.style.transform = 'scale(1)';
    container.style.backgroundSize = 'contain';
    container.style.backgroundPosition = 'center';

    zoomed = false;
  }

  // 页面初始化
  window.onload = async () => {
    console.log('桌面版页面加载启动...');
    
    if (LOAD_STRATEGY !== 'local') {
      await loadMapping();
    }
    
    try {
      await loadImage(currentVol, currentPage);
    } catch (err) {
      console.error('初始图片加载失败:', err);
    }
  };
</script>

</body>
