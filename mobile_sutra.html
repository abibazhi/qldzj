<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经 图片浏览</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: none;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      z-index: 10;
    }

    .error-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      z-index: 10;
      display: none;
    }

    .page-info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 10;
    }

    .controls {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    .control-btn {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      cursor: pointer;
    }

    .source-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      color: #0f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      z-index: 20;
      pointer-events: none;
    }
  </style>
<script>

  hm.src = "https://hm.baidu.com/hm.js?7784bc9ab299071f3a78b249954402c8";

</script>
</head>
<body>

<div class="container">
  <div class="image-wrapper" id="imageWrapper">
    <img id="imageView" src="" alt="乾隆大藏经图片"/>
  </div>
  <div class="loading-indicator" id="loadingIndicator">加载中...</div>
  <div class="error-message" id="errorMessage">加载失败</div>
  <div class="page-info" id="pageInfo"></div>
  <div class="source-badge" id="sourceBadge">---</div>

  <div class="controls">
    <button class="control-btn" id="zoomOutBtn">-</button>
    <button class="control-btn" id="resetBtn">1:1</button>
    <button class="control-btn" id="zoomInBtn">+</button>
  </div>
</div>

<script>
  const PREFER_IMGBB = true;
  const IMGBB_URL_TEMPLATE = 'https://i.ibb.co/{path}';
  let LOAD_STRATEGY = 'fallback';

  // 动态加载 mapping.js（防重复 + 双平台自动）
  async function loadMappingForVolume(vol) {
    return new Promise((resolve, reject) => {
      const vol3 = vol.toString().padStart(3, '0');
      const scriptId = `mapping-script-${vol3}`;

      if (document.getElementById(scriptId)) {
        console.log(`✅ 卷 ${vol3} 已加载，跳过`);
        resolve();
        return;
      }

      const script = document.createElement('script');
      script.id = scriptId;
      let src;

      const host = location.host.toLowerCase();
      if (host.includes("github.io")) {
        src = `/${vol3}/mapping.js`;
      } else {
        src = `https://pub-a0fc4de2782d448f916244913768fb78.r2.dev/${vol3}/mapping.js`;
      }

      script.src = src + "?t=" + Date.now();
      console.log("🔗 加载 mapping:", src);

      script.onload = () => {
        console.log("✅ 加载完成:", src);
        resolve();
      };

      script.onerror = () => {
        console.log("⚠️ 已加载，忽略");
        resolve();
      };

      document.head.appendChild(script);
    });
  }

  // 获取 URL 参数
  function getQueryVariable(variable) {
    const query = window.location.search.substring(1);
    const vars = query.split('&');
    for (let i = 0; i < vars.length; i++) {
      const pair = vars[i].split('=');
      if (pair[0] === variable) return decodeURIComponent(pair[1]);
    }
    return false;
  }

  const startParam = getQueryVariable('start') || '001001';
  const endParam = getQueryVariable('end') || '999999';

  function parseParam(param) {
    if (!/^\d+$/.test(param)) {
      return { vol: 1, page: 1 };
    }
    if (param.length === 6) {
      return {
        vol: parseInt(param.slice(0, 3), 10),
        page: parseInt(param.slice(3, 6), 10)
      };
    } else if (param.length === 7) {
      return {
        vol: parseInt(param.slice(0, 3), 10),
        page: parseInt(param.slice(3, 7), 10)
      };
    } else {
      return { vol: 1, page: 1 };
    }
  }

  const startData = parseParam(startParam);
  const endData = parseParam(endParam);

  let currentVol = startData.vol;
  let currentPage = startData.page;
  const startVol = startData.vol;
  const startPage = startData.page;
  const endVol = endData.vol;
  const endPage = endData.page;

  // 缩放变量
  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let lastScaleDistance = 0;
  let isLoading = false;
  let touchMode = null;
  let startX = 0, startY = 0;
  let startTranslateX = 0, startTranslateY = 0;
  let startTime = 0;
  const scaleFactor = 1.1;
  const zoomSensitivity = 0.1;
  const dragSpeedFactor = 1.5;

  const imageWrapper = document.getElementById('imageWrapper');
  const imageView = document.getElementById('imageView');
  const loadingIndicator = document.getElementById('loadingIndicator');
  const errorMessage = document.getElementById('errorMessage');
  const pageInfo = document.getElementById('pageInfo');
  const sourceBadge = document.getElementById('sourceBadge');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const resetBtn = document.getElementById('resetBtn');

  function showLoading() {
    if (isLoading) return;
    isLoading = true;
    loadingIndicator.style.display = 'block';
    errorMessage.style.display = 'none';
  }

  function hideLoading() {
    isLoading = false;
    loadingIndicator.style.display = 'none';
  }

  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = 'block';
    setTimeout(() => {
      errorMessage.style.display = 'none';
    }, 3000);
  }

  function updatePageInfo() {
    const volFormatted = String(currentVol).padStart(3, '0');
    pageInfo.textContent = `第 ${currentVol} 册 第 ${currentPage} 页`;
  }

  function updateTransform() {
    imageWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  }

  // 统一图片地址函数，返回 r2、github、imgbb
  function getImageUrls(vol, page) {
    const vol3 = String(vol).padStart(3, '0');
    const pageNum = parseInt(page, 10);

    const r2 = `https://pub-a0fc4de2782d448f916244913768fb78.r2.dev/${vol3}/${pageNum}.png`;
    const github = `https://raw.githubusercontent.com/jm33-pub/qldzj/main/${vol3}/${pageNum}.png`;

    let imgbb = null;
    if (mappingData && Array.isArray(mappingData)) {
      const index = pageNum - 1;
      if (index >= 0 && mappingData[index]) {
        const id = mappingData[index];
        imgbb = `https://i.ibb.co/${id}/${vol3}-${pageNum}-png.png`;
      }
    }

    return { r2, github, imgbb };
  }

  // 核心加载逻辑
  async function loadImage(vol, page) {
    showLoading();
    await loadMappingForVolume(vol);

    const host = location.host.toLowerCase();
    const isGitHub = host.includes("github.io");

    const urls = getImageUrls(vol, page);
    const r2Url = urls.r2;
    const githubUrl = urls.github;
    const imgbbUrl = urls.imgbb;

    updatePageInfo();

    // 判断是否为手机蜂窝网络
    function isMobileData() {
      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (conn) return conn.type === 'cellular';
      return /Android|iPhone|Mobile/.test(navigator.userAgent);
    }
    const usingMobileData = isMobileData();

    let primary = null, secondary = null, tertiary = null, label = "";

    // GitHub Pages 域名：固定 GitHub 优先
    if (isGitHub) {
      primary = githubUrl;
      secondary = r2Url;
      tertiary = imgbbUrl;
      label = "GitHub";
    } 
    // qldzj.daxumi.top 域名：按网络区分
    else {
      if (usingMobileData) {
        // 4G/5G 流量：R2 优先
        primary = r2Url;
        secondary = githubUrl;
        tertiary = imgbbUrl;
        label = "R2(流量)";
      } else {
        // WiFi 网络：ImgBB 优先
        primary = imgbbUrl;
        secondary = r2Url;
        tertiary = githubUrl;
        label = "ImgBB(WiFi)";
      }
    }

    // 依次尝试三个源
    if (primary) {
      const res = await tryLoadImage(primary);
      if (res.success) {
        imageView.src = primary;
        sourceBadge.textContent = label;
        hideLoading();
        resetView();
        return;
      }
    }
    if (secondary) {
      const res = await tryLoadImage(secondary);
      if (res.success) {
        imageView.src = secondary;
        sourceBadge.textContent = "次源";
        hideLoading();
        resetView();
        return;
      }
    }
    if (tertiary) {
      const res = await tryLoadImage(tertiary);
      if (res.success) {
        imageView.src = tertiary;
        sourceBadge.textContent = "备用";
        hideLoading();
        resetView();
        return;
      }
    }

    hideLoading();
    showError("所有源加载失败");
  }

  // 图片加载检测
  function tryLoadImage(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      const timeout = setTimeout(() => {
        img.onload = null;
        img.onerror = null;
        resolve({ success: false });
      }, 8000);

      img.onload = () => {
        clearTimeout(timeout);
        resolve({ success: true });
      };

      img.onerror = () => {
        clearTimeout(timeout);
        resolve({ success: false });
      };

      img.src = url;
    });
  }

  // 翻页逻辑
  async function changeImage(direction) {
    if (isLoading) return;

    let newVol = currentVol;
    let newPage = currentPage + direction;

    if (direction > 0) {
      if (newPage > 9999) {
        newPage = 1;
        newVol += 1;
      }
    } else {
      if (newPage < 1) {
        newPage = 9999;
        newVol -= 1;
      }
    }

    if (newVol < startVol || (newVol === startVol && newPage < startPage)) {
      showError('已经是第一页');
      return;
    }
    if (newVol > endVol || (newVol === endVol && newPage > endPage)) {
      showError('已经是最后一页');
      return;
    }
    if (newVol < 1) {
      showError('已经是第一页');
      return;
    }

    const prevVol = currentVol;
    const prevPage = currentPage;
    currentVol = newVol;
    currentPage = newPage;

    try {
      await loadImage(currentVol, currentPage);
    } catch (err) {
      currentVol = prevVol;
      currentPage = prevPage;
      showError(err.message);
    }
  }

  // 缩放处理
  function zoomAtCenter(centerX, centerY, scaleRatio) {
    const oldScale = scale;
    scale = Math.max(1, Math.min(5, scale * scaleRatio));
    translateX = centerX - ((centerX - translateX) * (scale / oldScale));
    translateY = centerY - ((centerY - translateY) * (scale / oldScale));

    const maxTX = (scale - 1) * window.innerWidth / 2;
    const maxTY = (scale - 1) * window.innerHeight / 2;
    translateX = Math.max(-maxTX, Math.min(maxTX, translateX));
    translateY = Math.max(-maxTY, Math.min(maxTY, translateY));
    updateTransform();
  }

  function resetView() {
    scale = 1;
    translateX = 0;
    translateY = 0;
    updateTransform();
  }

  // 触摸事件
  imageWrapper.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      touchMode = 'scale';
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastScaleDistance = Math.sqrt(dx*dx + dy*dy);
      startTranslateX = translateX;
      startTranslateY = translateY;
    } else if (e.touches.length === 1) {
      if (scale > 1) {
        touchMode = 'drag';
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startTranslateX = translateX;
        startTranslateY = translateY;
      } else {
        touchMode = 'swipe';
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startTime = Date.now();
      }
    }
  });

  imageWrapper.addEventListener('touchmove', (e) => {
    if (touchMode === 'scale' && e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const ratio = 1 + (dist / lastScaleDistance - 1) * zoomSensitivity;
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      zoomAtCenter(cx, cy, ratio);
      lastScaleDistance = dist;
    } else if (touchMode === 'drag' && e.touches.length === 1) {
      e.preventDefault();
      translateX = startTranslateX + (e.touches[0].clientX - startX) * dragSpeedFactor;
      translateY = startTranslateY + (e.touches[0].clientY - startY) * dragSpeedFactor;
      const maxTX = (scale - 1) * window.innerWidth / 2;
      const maxTY = (scale - 1) * window.innerHeight / 2;
      translateX = Math.max(-maxTX, Math.min(maxTX, translateX));
      translateY = Math.max(-maxTY, Math.min(maxTY, translateY));
      updateTransform();
    }
  });

  imageWrapper.addEventListener('touchend', (e) => {
    if (touchMode === 'swipe' && e.changedTouches.length === 1) {
      const dx = e.changedTouches[0].clientX - startX;
      const dur = Date.now() - startTime;
      if (Math.abs(dx) > 50 && dur < 500) {
        dx > 0 ? changeImage(-1) : changeImage(1);
      }
    }
    touchMode = null;
  });

  zoomInBtn.addEventListener('click', () => {
    zoomAtCenter(window.innerWidth/2, window.innerHeight/2, scaleFactor);
  });
  zoomOutBtn.addEventListener('click', () => {
    zoomAtCenter(window.innerWidth/2, window.innerHeight/2, 1/scaleFactor);
  });
  resetBtn.addEventListener('click', resetView);

  // 页面初始化
  window.onload = async () => {
    updatePageInfo();
    await loadImage(currentVol, currentPage);
  };
</script>

</body>
</html>
