<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经图片浏览</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .container {
      width: 100vw;
      height: 100vh;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: transparent;
      padding: 10px;
      box-shadow: 0 0 0 5px silver;
      box-sizing: border-box;
      touch-action: pan-x pan-y;
      transition: transform 0.3s ease-in-out;
      position: relative;
    }

    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
    }

    .source-badge {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #0f0;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      z-index: 100;
      pointer-events: none;
    }

    /* 仅增加工具栏样式，不影响原有布局 */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 999;
    }
    .control-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }
  </style>

  <script type="module" src="./js/utils.js"></script>
  <script type="module" src="./js/pageNav.js"></script>
  <script type="module" src="./js/imageLoader.js"></script>

<script>

</script>
</head>
<body>

<div id="imageContainer" class="container">
  <div id="loadingIndicator" class="loading-indicator">加载中...</div>
  <div id="sourceBadge" class="source-badge">---</div>
</div>

<!-- 底部工具栏 -->
<div class="controls">
  <button class="control-btn" id="zoomOutBtn">-</button>
  <button class="control-btn" id="resetBtn">1:1</button>
  <button class="control-btn" id="zoomInBtn">+</button>
</div>

<script type="module">
  import { getBestImageUrl } from './js/imageLoader.js'
  import { currentVol, currentPage, calcNextPage, setCurrentPage } from './js/pageNav.js';

  let zoomed = false;
  let isLoading = false;

  const edgeThreshold = 0.05;
  const container = document.getElementById('imageContainer');
  const loadingIndicator = document.getElementById('loadingIndicator');
  const sourceBadge = document.getElementById('sourceBadge');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const resetBtn = document.getElementById('resetBtn');

  function showLoading() {
    if (isLoading) return;
    isLoading = true;
    loadingIndicator.style.display = 'block';
  }

  function hideLoading() {
    isLoading = false;
    loadingIndicator.style.display = 'none';
  }

  // ======================
  // 完全恢复你原来的图片加载
  // ======================
  async function loadImage(vol, page) {
    showLoading();

    try {
      const best = await getBestImageUrl(vol, page);
      if (best) {
        container.style.backgroundImage = `url(${best.url})`;
        sourceBadge.textContent = best.key;
      } else {
        container.style.backgroundImage = "none";
        container.style.backgroundColor = "#222";
        sourceBadge.textContent = "失败";
      }
    } catch (e) {
      console.error(e);
    }

    hideLoading();
  }

  // ======================
  // 完全恢复你原来的翻页
  // ======================
  async function changeImage(direction) {
    if (zoomed || isLoading) {
      return;
    }
    const res = calcNextPage(direction);
    if (!res.ok) return;
    const { newVol, newPage } = res;
    await loadImage(newVol, newPage);
    setCurrentPage(newVol, newPage);
  }

  // ======================
  // 完全恢复你原来的鼠标
  // ======================
  function updateCursor(event) {
    const rect = event.target.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    const width = rect.width;
    const height = rect.height;

    const isTopEdge = y < height * edgeThreshold;
    const isBottomEdge = y > height * (1 - edgeThreshold);
    const isLeftEdge = x < width * edgeThreshold;
    const isRightEdge = x > width * (1 - edgeThreshold);

    if (isTopEdge || isBottomEdge || isLeftEdge || isRightEdge) {
      container.style.cursor = 'pointer';
    } else {
      container.style.cursor = 'auto';
    }
  }

  container.addEventListener('mousemove', updateCursor);
  container.addEventListener('mouseleave', () => {
    container.style.cursor = 'auto';
  });

  // ======================
  // 完全恢复你原来的点击翻页
  // ======================
  container.addEventListener('click', (event) => {
    const rect = event.target.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const width = rect.width;
    const isLeftEdge = clickX < width * edgeThreshold;
    const isRightEdge = clickX > width * (1 - edgeThreshold);

    if (isLeftEdge) {
      changeImage(-1);
    } else if (isRightEdge) {
      changeImage(1);
    }
  });

  // ======================
  // 🔥 100% 还原你原来的双击逻辑
  // ======================
  container.addEventListener('dblclick', handleDoubleClick);
  function handleDoubleClick(event) {
    if (isLoading) return;

    // 已经放大 → 只缩小
    if (zoomed) {
      zoomOut();
      return;
    }

    const rect = container.getBoundingClientRect();
    const y = event.clientY - rect.top;
    const height = rect.height;

    const isTopEdge = y < height * 0.05;
    const isBottomEdge = y > height * 0.95;

    // 只有双击顶部/底部才放大
    // 双击中间、左右 → 完全不响应！（你要的效果）
    if (isTopEdge) {
      zoomToPosition(0, 'top');
    } else if (isBottomEdge) {
      zoomToPosition(0, 'bottom');
    }
  }

  // ======================
  // 🔥 你原来的经验值参数全部保留
  // ======================
  function zoomToPosition(clickX, position) {
    const scale = 2.4;
    let transformOriginY = 'center';

    if (position === 'top') {
      transformOriginY = '11.8%';
    } else if (position === 'bottom') {
      transformOriginY = '80%';
    }

    container.style.transformOrigin = `50% ${transformOriginY}`;
    container.style.transform = `scale(${scale})`;
    container.style.backgroundSize = 'contain';
    container.style.backgroundPosition = 'center';

    zoomed = true;
  }

  function zoomOut() {
    container.style.transformOrigin = 'center';
    container.style.transform = 'scale(1)';
    container.style.backgroundSize = 'contain';
    container.style.backgroundPosition = 'center';
    zoomed = false;
  }

  // ======================
  // 工具栏按钮（新增，不影响原有逻辑）
  // ======================
  zoomInBtn.addEventListener('click', () => {
    if (zoomed) return;
    zoomToPosition(0, 'top');
  });
  zoomOutBtn.addEventListener('click', zoomOut);
  resetBtn.addEventListener('click', zoomOut);

  // ======================
  // 初始化
  // ======================
  window.onload = async () => {
    await loadImage(currentVol, currentPage);
  };
</script>

</body>
</html>
