<body>

      <a href="#group-3">第三组</a>
      <a href="#group-4">第四组</a>

      <a href="#group-9">第九组</a>

      <span class="total-badge" id="groupBadge">13 组 · ?? 条</span>

        <span style="color: #897a6a; font-size: 0.85rem;">🪷 json数据版 · opencode/qwen3.7 · 2026年7月15日 🪷</span>
        <span style="color: #897a6a; font-size: 0.85rem;">🪷 核对版 · qwen3.6-35b-a3b/localchat · 2026年7月23日 🪷</span>

<script type="module">
import { erratumPicData } from './data/erratum.json.js';
import { initImageFallback } from '../js/imageLoader.js';
initImageFallback();

// 定义链接图标，可根据喜好替换为 🔗, ↗, 📖 等
const ICON_ORIG = '🔗'; // 🔗表示附件，就是原始文件。
const ICON_COR = '📌'; // 📌使用图钉图标，表示“笔记/备注”，就是在原始图片上加一个提醒。
const ICON_NOTE = '🔍'; // 🔍 表示“去原文验证”

// ============================================================
// 工具函数：数字转中文数字（逐位转换）
// 例如：460 → 四六〇，102 → 一〇二
// ============================================================
function toChineseNumber(num) {
    if (num === null || num === undefined) return '';
    const digits = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    const numStr = String(num);
    let result = '';
    for (const char of numStr) {
        result += digits[Number(char)];
    }
    return result;
}

// ============================================================
// 工具函数：册数转中文数字
// 10-19 使用传统中文数字（十一、十二、十三...）
// 其他数字逐位转换（20 → 二〇，460 → 四六〇）
// ============================================================
function volumeToChinese(num) {
    if (num === null || num === undefined) return '';
    num = Number(num);
    
    // 10-19 使用传统中文数字
    if (num >= 10 && num <= 19) {
        const digits = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
        if (num === 10) return '十';
        return '十' + digits[num - 10];
    }
    
    // 其他数字逐位转换
    return toChineseNumber(num);
}


// ============================================================
// 工具函数：处理 note 列，自动添加勘误表链接
// 规则：取第一个“見XXX”页码计算 erratumNum = pageNum - 360
// 格式：https://qldzj.daxumi.top/public/sutra.html?start=169{三位}&end=169{三位}&sutra=
// 注意：即使有多个页码参考，也只取第一个生成链接，但包裹整个 note 文本
// 注意：文字链接换成在文字后面加一个图标链接。
// ============================================================
function processNoteToLink(note) {
  if (!note || !note.includes('見')) return note;

  const regex = /見([三四五六七八九][〇一二三四五六七八九十]+)([上下]?)/g;
  let match = regex.exec(note);
  if (!match) return note; 

  const firstPageStr = match[1];
  const cnMap = {'〇':0, '一':1, '二':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9};
  let pageNum = 0;
  for (const char of firstPageStr) {
    pageNum = pageNum * 10 + cnMap[char];
  }

  const erratumNum = pageNum - 360;
  const pagePadded = String(erratumNum).padStart(3, '0');
  const url = `https://qldzj.daxumi.top/public/sutra.html?start=169${pagePadded}&end=169${pagePadded}&sutra=`;

  // 【关键修改】：不再包裹整个 note，而是只替换第一个匹配的“見XXX”为带图标的链接
  // 这样其他文字（如换行后的第二行）保持普通样式，更清晰
  let result = note;
  // 替换第一个匹配项
  const firstMatch = note.substring(match.index, match.index + match[0].length);
  const linkHtml = `${firstMatch} <a href="${url}" title="查看勘误影像" style="text-decoration:none; color:#0066cc; font-size:0.85em;">${ICON_NOTE}</a>`;
  
  // 使用 replaceFirst 方法（JS原生不支持，需手动处理）
  result = note.replace(firstMatch, linkHtml);
  
  return result;
}





// ============================================================
// 主逻辑：生成所有组的内容
// ============================================================
function generateContent() {
    const container = document.getElementById('groupsContainer');
    if (!container) {
        console.error('❌ 找不到容器 #groupsContainer');
        return;
    }

    let totalItems = 0;
    let html = '';

    erratumPicData.groups.forEach((group, index) => {
        const groupNum = group.groupNum;
        const prevGroup = groupNum === 1 ? 13 : groupNum - 1;
        const nextGroup = groupNum === 13 ? 1 : groupNum + 1;
        const itemCount = group.items.length;
        totalItems += itemCount;

        // 中文数字组名
        const groupChinese = toChineseNumber(groupNum);
        const prevChinese = toChineseNumber(prevGroup);
        const nextChinese = toChineseNumber(nextGroup);

        // 生成分组 HTML
        html += `
  <div class="err-group" id="group-${groupNum}">
    <div class="group-title">
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; width: 100%;">
        <span>📖 第${groupChinese}组</span>
        <span class="num">原稿第 ${group.originalPage} 页 · 共 ${itemCount} 条</span>
        <span style="flex:1;"></span>
        <span class="page-nav">
          <a href="#group-${prevGroup}" title="上一组">‹ 上一组</a>
          <span class="page-nav-divider">|</span>
          <a href="#group-${nextGroup}" title="下一组">下一组 ›</a>
        </span>
      </div>
    </div>
    <div class="row-duo">
      <div class="col-image">
        <a href="${group.image}" class="lightbox" data-lightbox="erratum" data-title="影像${groupChinese}">
          <img
            src="${group.image}"
            data-r2="${group.image}"
            alt="勘误表来源影像${groupChinese}"
            title="点击放大查看原图 (1696x2362)"
            onerror="window.__erratumFallback(this)"
          >
        </a>
        <div style="display:none; color:#a48d7a; font-size:0.85rem; text-align:center; margin-top:0.3rem;">
          ⚠️ 图片无法加载，可查看下方表格内容。
        </div>
      </div>
      <div class="col-table">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr><th>册數</th><th>頁碼</th><th>欄</th><th>原文</th><th>更正</th><th>備註</th><th>核对备注</th></tr>
            </thead>
            <tbody>
              ${generateRows(group.items)}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
`;
    });

    container.innerHTML = html;
    
    // 更新组数
    document.getElementById('groupBadge').textContent = `13 组 · ${totalItems} 条`;
    
    console.log(`✅ 勘误表生成完成，共 ${totalItems} 条记录`);
}



// ============================================================
// 生成表格行（带链接版本）
// ============================================================

function generateRows(items) {
    return items.map(item => {

        const volumeStr = item.volume !== null ? volumeToChinese(item.volume) : '';
        
        // 特殊处理：V=36, P=13 显示为"十三"，非"一三"
        let pageStr;
        if (item.volume === 36 && String(item.page) === "13") {
            pageStr = "十三";
        } else {
            pageStr = item.page === '目錄' ? '目錄' : (item.page !== null ? toChineseNumber(item.page) : '');
        }
        
        const section = item.section || '';

        // ========== 生成锚点 ID ==========
        let anchorId = '';
        if (item.volume !== null && item.page !== null && item.page !== '') {
            const pageStrForId = item.page === '目錄' ? 'catalog' : item.page;
            anchorId = `vol-${item.volume}-page-${pageStrForId}`;
        }

        // 1. 原文列
        let locationHtml = item.location || '';
        if (item.locationHref) {
            const href = item.locationHref.split(' | ')[0];
            const linkTitle = href === '#' ? 'title="图片缺失，无法查看"' : 'title="点击查看原文"';
            locationHtml = `${item.location}&nbsp;<a href="${href}" ${linkTitle} style="text-decoration:none; color:#5f4f3f; font-size:0.85em;">${ICON_ORIG}</a>`;
        }
        
        // 2. 更正列
        let correctionHtml = item.correction || '';
        if (item.correctionHref) {
            const href = item.correctionHref.split(' | ')[0];
            correctionHtml = `${item.correction}&nbsp;<a href="${href}" title="点击查看更正" style="text-decoration:none; color:#0066cc; font-size:0.85em;">${ICON_COR}</a>`;
        }

        // 備註列
        const noteHtml = processNoteToLink(item.note);
        const verifyNoteHtml = item.verifyNote ? `<span class="verify-note">${item.verifyNote}</span>` : '';

        return `<tr id="${anchorId}"><td>${volumeStr}</td><td>${pageStr}</td><td>${section}</td><td>${locationHtml}</td><td>${correctionHtml}</td><td>${noteHtml}</td><td>${verifyNoteHtml}</td></tr>`;
    }).join('\n              ');
}


function generateRows1(items) {
    return items.map(item => {

        const volumeStr = item.volume !== null ? volumeToChinese(item.volume) : '';
        
        // 特殊处理：V=36, P=13 显示为"十三"，非"一三"
        let pageStr;
        if (item.volume === 36 && String(item.page) === "13") {
            pageStr = "十三";
        } else {
            pageStr = item.page === '目錄' ? '目錄' : (item.page !== null ? toChineseNumber(item.page) : '');
        }
        
        const section = item.section || '';
        

        // ==========================================
        // 【新增】安全处理链接：如果链接存在，追加图标；否则显示纯文本
        // ==========================================
        
        // 1. 原文列
//        let locationHtml = item.location || '';
        // 安全检查：确保 item.locationHref 存在且不为空字符串
//        if (item.locationHref) {
//            const href = item.locationHref.split(' | ')[0]; // 取第一个链接
            
            // 有个原始图片缺失，需要特殊处理
//            const linkTitle = href === '#' ? 'title="图片缺失，无法查看"' : 'title="点击查看原文"';

            // 使用 &nbsp; 分隔文字和图标，防止紧贴
//            locationHtml = `${item.location}&nbsp;<a href="${href}" ${linkTitle} style="text-decoration:none; color:#5f4f3f; font-size:0.85em;">${ICON_ORIG}</a>`;
//            // locationHtml = `${item.location}&nbsp;<a href="${href}" title="点击查看原文" style="text-decoration:none; color:#5f4f3f; font-size:0.85em;">${ICON_ORIG}</a>`;

           }
           // 如果 href 是 "#"，不生成链接，只显示文字
}
        
        // 2. 更正列
        let correctionHtml = item.correction || '';
        // 安全检查：确保 item.correctionHref 存在且不为空字符串
        if (item.correctionHref) {
           const href = item.correctionHref.split(' | ')[0]; // 取第一个链接
           correctionHtml = `${item.correction}&nbsp;<a href="${href}" title="点击查看更正" style="text-decoration:none; color:#0066cc; font-size:0.85em;">${ICON_COR}</a>`;
        }

        
        //// 備註列：原始勘误表备注
        //const noteHtml = item.note || '';
        // 使用新函数处理 note，自动添加链接
        const noteHtml = processNoteToLink(item.note);

        // 核对备注列：核对后的备注
        const verifyNoteHtml = item.verifyNote ? `<span class="verify-note">${item.verifyNote}</span>` : '';

        return `<tr><td>${volumeStr}</td><td>${pageStr}</td><td>${section}</td><td>${locationHtml}</td><td>${correctionHtml}</td><td>${noteHtml}</td><td>${verifyNoteHtml}</td></tr>`;
    }).join('\n              ');
}

// ============================================================
// 执行
// ============================================================
generateContent();
</script>

// 处理锚点跳转 - 使用浏览器默认滚动，只加高亮
if (window.location.hash) {
  // 清除之前所有的高亮
  document.querySelectorAll('.highlight-row').forEach(el => {
    el.style.backgroundColor = '';
    el.style.borderLeft = '';
  });

  setTimeout(() => {
    const target = document.querySelector(window.location.hash);
    if (target) {
      // 不手动控制滚动位置，让浏览器自己处理
      // 只添加高亮
      target.classList.add('highlight-row');
      target.style.backgroundColor = '#fef3e2';
      target.style.borderLeft = '4px solid #e67e22';
    }
  }, 500);
}
