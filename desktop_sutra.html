<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经图片浏览</title>

  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #zoomImage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .loading-indicator {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
    }

    .source-badge {
      position: absolute;
      bottom: 20px; right: 20px;
      background: rgba(0,0,0,0.6);
      color: #0f0;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 100;
    }

    .controls {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 12px;
      z-index: 999;
    }
    .control-btn {
      width: 48px; height: 48px;
      border-radius: 50%; border: none;
      background: rgba(0,0,0,0.6);
      color: white; font-size: 20px;
      cursor: pointer;
    }

    .hover-tooltip {
      position: fixed;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #floatTip {
      position: fixed;
      top: 30px; left: 50%;
      transform: translateX(-50%);
      background: #c0392b;
      color: #fff;
      padding: 8px 20px;
      border-radius: 4px;
      z-index: 10000;
      display: none;
    }
  </style>

  <script type="module" src="./js/utils.js"></script>
  <script type="module" src="./js/pageNav.js"></script>
  <script type="module" src="./js/imageLoader.js"></script>
</head>
<body>

<div class="container" id="imageContainer">
  <img id="zoomImage" alt="经文">
  <div id="loadingIndicator" class="loading-indicator">加载中...</div>
  <div id="sourceBadge" class="source-badge">---</div>
</div>

<div class="controls">
  <button class="control-btn" id="zoomOutBtn">-</button>
  <button class="control-btn" id="resetBtn">1:1</button>
  <button class="control-btn" id="zoomInBtn">+</button>
</div>

<div id="hoverTip" class="hover-tooltip">提示</div>
<div id="floatTip"></div>

<script type="module">
import { getBestImageUrl } from './js/imageLoader.js';
import { currentVol, currentPage, calcNextPage, setCurrentPage } from './js/pageNav.js';

let isLoading = false;
let panzoom = null;
const edgeThreshold = 0.05;

const container = document.getElementById('imageContainer');
const img = document.getElementById('zoomImage');
const loadingIndicator = document.getElementById('loadingIndicator');
const sourceBadge = document.getElementById('sourceBadge');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const resetBtn = document.getElementById('resetBtn');
const hoverTip = document.getElementById('hoverTip');
const floatTip = document.getElementById('floatTip');

function showTempTip(msg) {
  floatTip.textContent = msg;
  floatTip.style.display = 'block';
  setTimeout(() => floatTip.style.display = 'none', 2000);
}
function showTip(x, y, text) {
  hoverTip.style.left = x + 'px';
  hoverTip.style.top = y + 'px';
  hoverTip.textContent = text;
  hoverTip.style.opacity = 1;
}
function hideTip() { hoverTip.style.opacity = 0; }

// 🔥 初始化
function initPanzoom() {
  panzoom = Panzoom(img, {
    maxScale: 5,
    minScale: 1,
    step: 0.15,
    cursor: 'grab',
    pinchAndZoom: true
  });

  // ✅ 滚轮改成【始终中心缩放】，不跟鼠标走
  container.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1 : -1;
    const step = 0.15;
    const newScale = panzoom.getScale() + delta * step;
    panzoom.zoom(newScale, { focal: { x: 0.5, y: 0.5 } }); // 固定中心
  });
}

function showLoading() { isLoading = true; loadingIndicator.style.display = 'block'; }
function hideLoading() { isLoading = false; loadingIndicator.style.display = 'none'; }

async function loadImage(vol, page) {
  showLoading();
  try {
    const best = await getBestImageUrl(vol, page);
    if (best) {
      img.src = best.url;
      sourceBadge.textContent = best.key;
    } else {
      img.src = '';
      sourceBadge.textContent = '失败';
    }
  } catch (e) { console.error(e); }
  hideLoading();
  panzoom.reset();
}

async function changeImage(direction) {
  if (isLoading || panzoom.getScale() > 1) return;
  const res = calcNextPage(direction);
  if (!res.ok) return showTempTip(direction > 0 ? "最后一页" : "第一页");
  const { newVol, newPage } = res;
  await loadImage(newVol, newPage);
  setCurrentPage(newVol, newPage);
}

// ✅ 放大时完全不显示翻页提示
container.addEventListener('mousemove', e => {
  const scale = panzoom.getScale();
  if (scale > 1) return hideTip(); // 放大状态：直接不显示

  const r = container.getBoundingClientRect();
  const x = e.clientX - r.left;
  const w = r.width;

  if (x < w * edgeThreshold) {
    showTip(e.clientX, e.clientY - 30, "← 上一页");
  } else if (x > w * (1 - edgeThreshold)) {
    showTip(e.clientX, e.clientY - 30, "下一页 →");
  } else {
    hideTip();
  }
});
container.addEventListener('mouseleave', hideTip);

container.addEventListener('click', e => {
  const scale = panzoom.getScale();
  if (scale > 1) return;
  const r = container.getBoundingClientRect();
  const x = e.clientX - r.left;
  const w = r.width;
  if (x < w * edgeThreshold) changeImage(-1);
  else if (x > w * (1 - edgeThreshold)) changeImage(1);
});

// ❌ 双击放大顶部/底部：全部删掉了

zoomInBtn.onclick = () => panzoom.zoomIn();
zoomOutBtn.onclick = () => panzoom.zoomOut();
resetBtn.onclick = () => panzoom.reset();

zoomInBtn.onmouseenter = () => showTip(zoomInBtn.getBoundingClientRect().x, zoomInBtn.getBoundingClientRect().y-40, "放大");
zoomOutBtn.onmouseenter = () => showTip(zoomOutBtn.getBoundingClientRect().x, zoomOutBtn.getBoundingClientRect().y-40, "缩小");
resetBtn.onmouseenter = () => showTip(resetBtn.getBoundingClientRect().x, resetBtn.getBoundingClientRect().y-40, "重置 1:1");
zoomInBtn.onmouseleave = zoomOutBtn.onmouseleave = resetBtn.onmouseleave = hideTip;

window.onload = () => {
  initPanzoom();
  loadImage(currentVol, currentPage);
};
</script>
<script src="js/tongji.baidu.js"></script>
</body>
</html>
