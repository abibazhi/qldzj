<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经</title>
  <link rel="stylesheet" href="css/viewerControl.css">

  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <script type="module" src="./js/utils.js"></script>
  <script type="module" src="./js/pageNav.js"></script>
  <script type="module" src="./js/imageLoader.js"></script>
  <script type="module" src="./js/sutraInfo.js"></script>
  <script src="js/tongji.baidu.js"></script>

  <!-- 调试控制台 vConsole -->
  <script src="https://cdn.bootcdn.net/ajax/libs/vConsole/3.15.0/vConsole.min.js"></script>

  <style>
    /* --------------------------
     🔥 图片大小 & 位置 【你自己改这里】
     -------------------------- */
    .image-wrapper {
      display: block !important;
      padding-top: 200px !important;   /* 给顶部信息栏腾出空间 */
    }
    #imageView {
      width: 140% !important;         /* 初始宽度：调大更满 */
      height: auto !important;
      display: block;
      margin: 0 auto;
      border: 1px solid red;          /* 加红框，方便看位置 */
    }

    /* vConsole 强制置顶 */
    #vconsole {
      z-index: 9999999 !important;
    }

/* 顶部信息栏 - 完全透明，无背景无边框 */
.top-info-bar {
  position: fixed;
  top: 10px;
  left: 0;
  right: 0;
  background: transparent;  /* 完全透明 */
  padding: 12px 16px;
  z-index: 999;
  text-align: center;
  pointer-events: none;
  /* 删除 box-shadow */
  /* 删除 border-bottom */
}

.sutra-title {
  font-size: clamp(14px, 5vw, 20px);
  font-weight: 500;
  color: #000;
  letter-spacing: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 90vw;
  display: block;
  text-shadow: 0 0 4px rgba(255, 255, 255, 0.8);  /* 可选：白色背景光，让文字在复杂背景下可读 */
}

.roll-title {
  font-size: clamp(11px, 4vw, 14px);
  color: #333;               /* 稍微淡一点，区分层次 */
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 90vw;
  display: block;
  text-shadow: 0 0 4px rgba(255, 255, 255, 0.8);  /* 可选 */
}

  </style>
</head>
<body>

<div class="container">
  <!-- 顶部信息栏 -->
  <div class="top-info-bar">
    <div id="sutraTitle" class="sutra-title">乾隆大藏经</div>
    <div id="rollTitle" class="roll-title"></div>
  </div>

  <div class="image-wrapper" id="imageWrapper">
    <img id="imageView" src="" alt="经文图片">
  </div>

  <div class="loading-indicator" id="loadingIndicator">加载中...</div>
  <div class="error-message" id="errorMessage">加载失败</div>
  <div class="page-info" id="pageInfo"></div>
  <div class="source-badge" id="sourceBadge">---</div>

  <div class="controls">
    <button class="control-btn" id="zoomOutBtn">-</button>
    <button class="control-btn" id="resetBtn">1:1</button>
    <button class="control-btn" id="zoomInBtn">+</button>
  </div>
</div>

<div id="floatTip" style="position:fixed;top:30px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:8px 20px;border-radius:4px;z-index:10000;display:none;"></div>

<script type="module">
import { currentVol, currentPage, calcNextPage, setCurrentPage } from './js/pageNav.js';
import { getBestImageUrl } from './js/imageLoader.js';
import { fetchSutraInfo, getRollTitle } from './js/sutraInfo.js';

let isLoading = false;
let startX = 0;
let panzoom = null;
let currentSutraInfo = null;

const imageWrapper = document.getElementById('imageWrapper');
const imageView = document.getElementById('imageView');
const loadingIndicator = document.getElementById('loadingIndicator');
const pageInfo = document.getElementById('pageInfo');
const sourceBadge = document.getElementById('sourceBadge');
const floatTip = document.getElementById('floatTip');
const sutraTitleElem = document.getElementById('sutraTitle');
const rollTitleElem = document.getElementById('rollTitle');

// 调试工具
setTimeout(() => new VConsole(), 800);
function showTempTip(msg) {
  floatTip.textContent = msg;
  floatTip.style.display = 'block';
  setTimeout(() => floatTip.style.display = 'none', 2000);
}

// 初始化手势
function initPanzoom() {
  panzoom = Panzoom(imageWrapper, {
    maxScale: 5,
    minScale: 1,
    step: 0.15,
    cursor: 'grab',
    pinchAndZoom: true
  });
  imageWrapper.addEventListener('wheel', panzoom.zoomWithWheel);
}

// 加载 & 翻页
function showLoading() { isLoading = true; loadingIndicator.style.display = 'block'; }
function hideLoading() { isLoading = false; loadingIndicator.style.display = 'none'; }
function updatePageInfo() { pageInfo.textContent = `第 ${currentVol} 册 第 ${currentPage} 页`; }

// 更新顶部信息
function updateTopInfo(title, rollName) {
    if (title) {
        sutraTitleElem.textContent = `乾隆大藏经 · ${title}`;
    }
    if (rollName !== undefined) {
        rollTitleElem.textContent = rollName;
    }
}

// 加载经卷信息
async function loadSutraInfo() {
    const urlParams = new URLSearchParams(window.location.search);
    const sutraNum = urlParams.get('sutra');
    const currentIdx = urlParams.get('idx');
    
    if (!sutraNum) return;
    
    const info = await fetchSutraInfo(sutraNum);
    if (!info) return;
    
    currentSutraInfo = info;
    const rollName = getRollTitle(info.rolls, currentIdx);
    updateTopInfo(info.title, rollName);
}

// 翻页后更新卷名
async function updateRollAfterPageChange() {
    if (!currentSutraInfo) return;
    const urlParams = new URLSearchParams(window.location.search);
    const currentIdx = urlParams.get('idx');
    if (currentIdx) {
        const rollName = getRollTitle(currentSutraInfo.rolls, currentIdx);
        rollTitleElem.textContent = rollName;
    }
}

async function loadImage(vol, page) {
  showLoading();
  try {
    const best = await getBestImageUrl(vol, page);
    if (best) {
      imageView.src = best.url;
      sourceBadge.textContent = best.key;
    } else showTempTip("加载失败");
  } catch (e) { showTempTip("加载异常"); }
  hideLoading();
}

async function changeImage(direction) {
  if (isLoading) return;
  const res = calcNextPage(direction);
  if (!res.ok) return showTempTip(direction > 0 ? "已经是最后一页" : "已经是第一页");
  const { newVol, newPage } = res;
  await loadImage(newVol, newPage);
  setCurrentPage(newVol, newPage);
  updatePageInfo();
  panzoom.reset();
  await updateRollAfterPageChange();
}

// 按钮
document.getElementById('zoomInBtn').onclick = () => panzoom.zoomIn();
document.getElementById('zoomOutBtn').onclick = () => panzoom.zoomOut();
document.getElementById('resetBtn').onclick = () => panzoom.reset();

// --------------------------
// ✅ 【完美翻页逻辑】
// 只有 1:1 才能翻页，放大时绝不翻页
// --------------------------
imageWrapper.addEventListener('touchstart', e => {
  if (panzoom.getScale() === 1) {
    startX = e.touches[0].clientX;
  }
});

imageWrapper.addEventListener('touchend', e => {
  const scale = panzoom.getScale();
  if (scale !== 1) return;

  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 50) {
    changeImage(dx > 0 ? -1 : 1);
  }
});

window.onload = async () => {
  initPanzoom();
  updatePageInfo();
  await loadImage(currentVol, currentPage);
  await loadSutraInfo();
};
</script>
</body>
</html>
