<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经图片浏览</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: none; /* 禁用默认的触摸行为 */
    }

    .container {
      width: 100vw;
      height: 100vh;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #000;
      transition: transform 0.3s ease-in-out;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none; /* 确保图片不会干扰手势 */
    }

    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>

<div id="imageContainer" class="container">
  <img id="imageView" src="" alt="Image Viewer"/>
  <div id="loadingIndicator" class="loading-indicator">加载中...</div>
</div>

<script>
  function getQueryVariable(variable) {
    const query = window.location.search.substring(1);
    const vars = query.split('&');
    for (let i = 0; i < vars.length; i++) {
      const pair = vars[i].split('=');
      if (pair[0] === variable) return decodeURIComponent(pair[1]);
    }
    return false;
  }

  const startParam = getQueryVariable('start') || '001001';
  const endParam = getQueryVariable('end') || '999999';

  let currentVol = startParam.slice(0, 3);
  let currentPage = startParam.slice(3, 6);
  let scale = 1;
  let lastScale = 1;
  let startX = 0, startY = 0;
  let moveX = 0, moveY = 0;
  let isLoading = false;

  const container = document.getElementById('imageContainer');
  const imageView = document.getElementById('imageView');
  const loadingIndicator = document.getElementById('loadingIndicator');

  function showLoading() {
    if (isLoading) return;
    isLoading = true;
    loadingIndicator.style.display = 'block';
  }

  function hideLoading() {
    isLoading = false;
    loadingIndicator.style.display = 'none';
  }

  function loadImage(vol, page) {
    return new Promise((resolve, reject) => {
      showLoading();

      const imgUrl = `/qldzj/${vol}/${page}.png`;

      imageView.onload = () => {
        hideLoading();
        resolve();
      };

      imageView.onerror = (err) => {
        hideLoading();
        reject(err);
      };

      imageView.src = imgUrl;
    });
  }

  async function changeImage(direction) {
    if (isLoading) return;

    let newPage = parseInt(currentPage, 10) + direction;
    let newVol = parseInt(currentVol, 10);

    if (direction > 0) {
      if (newPage >= 999) {
        newPage = 1;
        newVol += 1;
      }
    } else {
      if (newPage <= 1) {
        newPage = 999;
        newVol -= 1;
      }
    }

    newVol = newVol.toString().padStart(3, '0');
    newPage = newPage.toString().padStart(3, '0');

    try {
      await loadImage(newVol, newPage);
      currentVol = newVol;
      currentPage = newPage;
    } catch (err) {
      console.error('图片加载失败:', err);
    }
  }

  container.addEventListener('touchstart', (event) => {
    if(event.touches.length === 2){
      // 双指缩放开始时记录初始距离
      let dx = event.touches[0].clientX - event.touches[1].clientX;
      let dy = event.touches[0].clientY - event.touches[1].clientY;
      lastScale = Math.sqrt(dx * dx + dy * dy);
    } else if(event.touches.length === 1){
      // 单点触摸用于拖拽图片
      startX = event.touches[0].pageX - moveX;
      startY = event.touches[0].pageY - moveY;
    }
  });

  container.addEventListener('touchmove', (event) => {
    if(event.touches.length === 2){
      // 双指缩放
      let dx = event.touches[0].clientX - event.touches[1].clientX;
      let dy = event.touches[0].clientY - event.touches[1].clientY;
      let currentDistance = Math.sqrt(dx * dx + dy * dy);
      scale = currentDistance / lastScale;

      container.style.transform = `translate(${moveX}px, ${moveY}px) scale(${scale})`;
    } else if(event.touches.length === 1 && !isLoading){
      // 单点触摸拖拽
      moveX = event.touches[0].pageX - startX;
      moveY = event.touches[0].pageY - startY;

      container.style.transform = `translate(${moveX}px, ${moveY}px) scale(${scale})`;
    }
  });

  container.addEventListener('touchend', (event) => {
    if(event.changedTouches.length === 1){
      const endTouchX = event.changedTouches[0].pageX;
      const deltaX = endTouchX - startX;

      if(deltaX > 50){
        changeImage(-1); // 向左滑动翻前一页
      }else if(deltaX < -50){
        changeImage(1); // 向右滑动翻下一页
      }
    }
  });

  window.onload = async () => {
    try {
      await loadImage(currentVol, currentPage);
    } catch (err) {
      console.error('初始图片加载失败:', err);
    }
  };
</script>

</body>
</html>
