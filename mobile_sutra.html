<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经 图片浏览</title>

  <!-- 引入抽离的看图样式 -->
  <link rel="stylesheet" href="css/viewerControl.css">

  <script type="module" src="./js/utils.js"></script>
  <script type="module" src="./js/pageNav.js"></script>
  <script type="module" src="./js/imageLoader.js"></script>
  <!-- 引入抽离的看图控制器 -->
  <script type="module" src="./js/viewerControl.js"></script>

<body>

<div class="container">
  <div class="image-wrapper" id="imageWrapper">
    <img id="imageView" src="" alt="乾隆大藏经图片"/>
  </div>
  <div class="loading-indicator" id="loadingIndicator">加载中...</div>
  <div class="error-message" id="errorMessage">图片加载失败</div>
  <div class="page-info" id="pageInfo"></div>
  <div class="source-badge" id="sourceBadge">---</div>

  <div class="controls">
    <button class="control-btn" id="zoomOutBtn">-</button>
    <button class="control-btn" id="resetBtn">1:1</button>
    <button class="control-btn" id="zoomInBtn">+</button>
  </div>
</div>

<script type="module">
import { currentVol, currentPage, calcNextPage, setCurrentPage } from './js/pageNav.js';
import { getBestImageUrl } from './js/imageLoader.js';
import { zoomIn, zoomOut, resetView, zoomAtCenter, dragAbsolute, isZoomed } from './js/viewerControl.js';

let lastScaleDistance = 0;
let isLoading = false;
let touchMode = null;
let startX = 0, startY = 0;
let startTime = 0;

const imageWrapper = document.getElementById('imageWrapper');
const imageView = document.getElementById('imageView');
const loadingIndicator = document.getElementById('loadingIndicator');
const errorMessage = document.getElementById('errorMessage');
const pageInfo = document.getElementById('pageInfo');
const sourceBadge = document.getElementById('sourceBadge');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const resetBtn = document.getElementById('resetBtn');

function showLoading() {
  if (isLoading) return;
  isLoading = true;
  loadingIndicator.style.display = 'block';
  errorMessage.style.display = 'none';
}
function hideLoading() {
  isLoading = false;
  loadingIndicator.style.display = 'none';
}
function showError(msg) {
  errorMessage.textContent = msg;
  errorMessage.style.display = 'block';
  setTimeout(() => errorMessage.style.display = 'none', 3000);
}
function updatePageInfo() {
  pageInfo.textContent = `第 ${currentVol} 册 第 ${currentPage} 页`;
}

async function loadImage(vol, page) {
  showLoading();
  try {
    const best = await getBestImageUrl(vol, page);
    if (best) {
      imageView.src = best.url;
      sourceBadge.textContent = best.key;
    } else {
      showError("加载失败");
    }
  } catch (e) {
    console.error(e);
    showError("加载异常");
  }
  hideLoading();
}

async function changeImage(direction) {
  if (isLoading) return;
  const res = calcNextPage(direction);
  if (!res.ok) {
    showError(direction > 0 ? "已经是最后一页" : "已经是第一页");
    return;
  }
  const { newVol, newPage } = res;
  await loadImage(newVol, newPage);
  setCurrentPage(newVol, newPage);
  updatePageInfo();
}

// ------------------------------
// 触摸手势
// ------------------------------
imageWrapper.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    touchMode = 'scale';
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastScaleDistance = Math.hypot(dx, dy);
  } else if (e.touches.length === 1) {
    if (isZoomed()) {
      touchMode = 'drag';
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    } else {
      touchMode = 'swipe';
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      startTime = Date.now();
    }
  }
});

imageWrapper.addEventListener('touchmove', (e) => {
  if (touchMode === 'scale' && e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const ratio = 1 + (dist - lastScaleDistance) / lastScaleDistance;
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    zoomAtCenter(cx, cy, ratio, imageWrapper);
    lastScaleDistance = dist;
  } else if (touchMode === 'drag' && e.touches.length === 1) {
    e.preventDefault();
    const currentX = event.touches[0].clientX;
    const currentY = event.touches[0].clientY;    
    //drag(dx, dy, imageWrapper);
    // 🔥 调用你原来风格的绝对定位拖拽
    dragAbsolute({
      startX: startX,
      startY: startY,
      startXVal: startTranslateX,
      startYVal: startTranslateY
    }, currentX, currentY, imageWrapper);

  } else if (touchMode === 'swipe' && e.touches.length === 1) {
    const dy = e.touches[0].clientY - startY;
    if (Math.abs(dy) > 50) touchMode = null;
  }
});

imageWrapper.addEventListener('touchend', (e) => {
  if (touchMode === 'swipe') {
    const endX = e.changedTouches[0].clientX;
    const dx = endX - startX;
    const dur = Date.now() - startTime;
    if (Math.abs(dx) > 50 && dur < 500) {
      changeImage(dx > 0 ? -1 : 1);
    }
  }
  touchMode = null;
});

// 按钮
zoomInBtn.addEventListener('click', () => zoomIn(imageWrapper));
zoomOutBtn.addEventListener('click', () => zoomOut(imageWrapper));
resetBtn.addEventListener('click', () => resetView(imageWrapper));

window.onload = async () => {
  updatePageInfo();
  await loadImage(currentVol, currentPage);
};
</script>
</body>
</html>
