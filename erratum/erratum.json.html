<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="erratum.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simplelightbox@2.14.3/dist/simple-lightbox.min.css">
  <title>乾隆大藏经 · 勘误表（图文对照 · 动态版）</title>
  <style>
    .container {
      zoom: 0.8;
      transform: none;
      transform-origin: unset;
      max-width: 1500px;
      margin: 0 auto;
    }
    td:nth-child(6) {
      background-color: #fffdfb;
      color: inherit;
      font-size: inherit;
    }
    .silk-border {
      margin-bottom: 1.5rem;
    }
  </style>
</head>

<body>
<div class="container">
  <div id="section-pic" class="section-block">
    <div class="global-header">
      <h1>📜 勘误表 · 图文对照</h1>
      <div class="badge-group">
        <span>🖌 完全按图片翻录</span>
        <span id="totalCount">📌 共 ?? 条</span>
      </div>
    </div>

    <div class="jump-nav">
      <span class="label">⏩ 跳转至</span>
      <a href="#group-1">第一组</a>
      <a href="#group-2">第二组</a>
      <a href="#group-3">第三组</a>
      <a href="#group-4">第四组</a>
      <a href="#group-5">第五组</a>
      <a href="#group-6">第六组</a>
      <a href="#group-7">第七组</a>
      <a href="#group-8">第八组</a>
      <a href="#group-9">第九组</a>
      <a href="#group-10">第十组</a>
      <a href="#group-11">第十一组</a>
      <a href="#group-12">第十二组</a>
      <a href="#group-13">第十三组</a>
      <span class="total-badge" id="groupBadge">13 组 · ?? 条</span>
    </div>

    <div id="groupsContainer">
      <!-- 由 JavaScript 动态生成 -->
    </div>

    <div class="silk-border">
      <div style="display: flex; gap: 1.8rem; flex-wrap: wrap; align-items: center;">
        <span style="color: #897a6a; font-size: 0.85rem;">🪷 千问 · 2026年7月14日 🪷</span>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { erratumPicData } from './data/erratum.json.js';

// ============================================================
// 工具函数：数字转中文数字（逐位转换）
// 例如：460 → 四六〇，102 → 一〇二
// ============================================================
function toChineseNumber(num) {
    if (num === null || num === undefined) return '';
    const digits = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    const numStr = String(num);
    let result = '';
    for (const char of numStr) {
        result += digits[Number(char)];
    }
    return result;
}

// ============================================================
// 工具函数：册数转中文数字
// 10-19 使用传统中文数字（十一、十二、十三...）
// 其他数字逐位转换（20 → 二〇，460 → 四六〇）
// ============================================================
function volumeToChinese(num) {
    if (num === null || num === undefined) return '';
    num = Number(num);
    
    // 10-19 使用传统中文数字
    if (num >= 10 && num <= 19) {
        const digits = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
        if (num === 10) return '十';
        return '十' + digits[num - 10];
    }
    
    // 其他数字逐位转换
    return toChineseNumber(num);
}

// ============================================================
// 主逻辑：生成所有组的内容
// ============================================================
function generateContent() {
    const container = document.getElementById('groupsContainer');
    if (!container) {
        console.error('❌ 找不到容器 #groupsContainer');
        return;
    }

    let totalItems = 0;
    let html = '';

    erratumPicData.groups.forEach((group, index) => {
        const groupNum = group.groupNum;
        const prevGroup = groupNum === 1 ? 13 : groupNum - 1;
        const nextGroup = groupNum === 13 ? 1 : groupNum + 1;
        const itemCount = group.items.length;
        totalItems += itemCount;

        // 中文数字组名
        const groupChinese = toChineseNumber(groupNum);
        const prevChinese = toChineseNumber(prevGroup);
        const nextChinese = toChineseNumber(nextGroup);

        // 生成分组 HTML
        html += `
  <div class="err-group" id="group-${groupNum}">
    <div class="group-title">
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; width: 100%;">
        <span>📖 第${groupChinese}组</span>
        <span class="num">原稿第 ${group.originalPage} 页 · 共 ${itemCount} 条</span>
        <span style="flex:1;"></span>
        <span class="page-nav">
          <a href="#group-${prevGroup}" title="上一组">‹ 上一组</a>
          <span class="page-nav-divider">|</span>
          <a href="#group-${nextGroup}" title="下一组">下一组 ›</a>
        </span>
      </div>
    </div>
    <div class="row-duo">
      <div class="col-image">
        <a href="${group.image}" class="lightbox" data-lightbox="erratum" data-title="影像${groupChinese}">
          <img
            src="${group.image}"
            alt="勘误表来源影像${groupChinese}"
            title="点击放大查看原图 (1696x2362)"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
          >
        </a>
        <div style="display:none; color:#a48d7a; font-size:0.85rem; text-align:center; margin-top:0.3rem;">
          ⚠️ 图片无法加载，可查看下方表格内容。
        </div>
      </div>
      <div class="col-table">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr><th>册數</th><th>頁碼</th><th>欄</th><th>原文</th><th>更正</th><th>備註</th></tr>
            </thead>
            <tbody>
              ${generateRows(group.items)}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
`;
    });

    container.innerHTML = html;
    
    // 更新总数
    document.getElementById('totalCount').textContent = `📌 共 ${totalItems} 条`;
    document.getElementById('groupBadge').textContent = `13 组 · ${totalItems} 条`;
    
    console.log(`✅ 勘误表生成完成，共 ${totalItems} 条记录`);
}

// ============================================================
// 生成表格行
// ============================================================
function generateRows(items) {
    return items.map(item => {
        const volumeStr = item.volume !== null ? volumeToChinese(item.volume) : '';
        const pageStr = item.page === '目錄' ? '目錄' : (item.page !== null ? toChineseNumber(item.page) : '');
        const section = item.section || '';
        const location = item.location || '';
        const correction = item.correction || '';
        const note = item.note || '';

        return `<tr><td>${volumeStr}</td><td>${pageStr}</td><td>${section}</td><td>${location}</td><td>${correction}</td><td>${note}</td></tr>`;
    }).join('\n              ');
}

// ============================================================
// 执行
// ============================================================
generateContent();
</script>

<script src="https://cdn.jsdelivr.net/npm/simplelightbox@2.14.3/dist/simple-lightbox.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    new SimpleLightbox('.lightbox', {
      captionsData: 'title',
      captionDelay: 250,
      scaleImageToRatio: true,
      disableRightClick: false,
    });
  });
</script>

</body>
</html>
