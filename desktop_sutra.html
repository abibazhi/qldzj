<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经图片浏览</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    /* 蓝色边框，方便看位置 */
    .container {
      width: 100vw;
      height: 100vh;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: transparent;
      padding: 10px;
      box-shadow: 0 0 0 5px blue;
      box-sizing: border-box;
      touch-action: pan-x pan-y;
      transition: transform 0.3s ease-in-out;
      position: relative;
    }

    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
    }

    .source-badge {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      color: #0f0;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      z-index: 100;
      pointer-events: none;
    }

    /* 工具栏 */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 999;
    }
    .control-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    /* 悬浮提示 */
    .hover-tooltip {
      position: fixed;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
  </style>

  <script type="module" src="./js/utils.js"></script>
  <script type="module" src="./js/pageNav.js"></script>
  <script type="module" src="./js/imageLoader.js"></script>

<script>

</head>
<body>

<div id="imageContainer" class="container">
  <div id="loadingIndicator" class="loading-indicator">加载中...</div>
  <div id="sourceBadge" class="source-badge">---</div>
</div>

<div class="controls">
  <button class="control-btn" id="zoomOutBtn">-</button>
  <button class="control-btn" id="resetBtn">1:1</button>
  <button class="control-btn" id="zoomInBtn">+</button>
</div>

<div id="hoverTip" class="hover-tooltip">提示</div>

<script type="module">
import { getBestImageUrl } from './js/imageLoader.js';
import { currentVol, currentPage, calcNextPage, setCurrentPage } from './js/pageNav.js';

let zoomed = false;
let isLoading = false;
const edgeThreshold = 0.05;
// 新增：记录当前缩放比例，支持连续缩放
let currentScale = 1;
// 缩放步长，和移动端保持一致
const scaleStep = 0.2;
// 缩放上下限
const minScale = 1;
const maxScale = 5;

const container = document.getElementById('imageContainer');
const loadingIndicator = document.getElementById('loadingIndicator');
const sourceBadge = document.getElementById('sourceBadge');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const resetBtn = document.getElementById('resetBtn');
const hoverTip = document.getElementById('hoverTip');

// 提示工具
function showTip(x, y, text) {
  hoverTip.style.left = x + 'px';
  hoverTip.style.top = y + 'px';
  hoverTip.textContent = text;
  hoverTip.style.opacity = 1;
}
function hideTip() {
  hoverTip.style.opacity = 0;
}

function showLoading() {
  if (isLoading) return;
  isLoading = true;
  loadingIndicator.style.display = 'block';
}
function hideLoading() {
  isLoading = false;
  loadingIndicator.style.display = 'none';
}

async function loadImage(vol, page) {
  showLoading();
  try {
    const best = await getBestImageUrl(vol, page);
    if (best) {
      container.style.backgroundImage = `url(${best.url})`;
      sourceBadge.textContent = best.key;
    } else {
      container.style.backgroundImage = "none";
      container.style.backgroundColor = "#222";
      sourceBadge.textContent = "失败";
    }
  } catch (e) { console.error(e); }
  hideLoading();
}

// 翻页逻辑（同移动端）
async function changeImage(direction) {
  if (zoomed || isLoading) return;

  const res = calcNextPage(direction);
  if (!res.ok) {
    alert(direction > 0 ? "已经是最后一页" : "已经是第一页");
    return;
  }

  const { newVol, newPage } = res;
  await loadImage(newVol, newPage);
  setCurrentPage(newVol, newPage);
}

// 鼠标悬浮提示
container.addEventListener('mousemove', e => {
  const r = container.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;
  const w = r.width;
  const h = r.height;

  const left = x < w * edgeThreshold;
  const right = x > w * (1 - edgeThreshold);
  const top = y < h * 0.05;
  const bottom = y > h * 0.95;

  if (left) {
    showTip(e.clientX, e.clientY - 30, "← 上一页");
  } else if (right) {
    showTip(e.clientX, e.clientY - 30, "下一页 →");
  } else if (top) {
    showTip(e.clientX, e.clientY + 20, "双击放大顶部");
  } else if (bottom) {
    showTip(e.clientX, e.clientY - 50, "双击放大底部");
  } else {
    hideTip();
  }
});

container.addEventListener('mouseleave', hideTip);

// 点击翻页
container.addEventListener('click', e => {
  const r = container.getBoundingClientRect();
  const x = e.clientX - r.left;
  const w = r.width;
  if (x < w * edgeThreshold) changeImage(-1);
  else if (x > w * (1 - edgeThreshold)) changeImage(1);
});

// 双击逻辑（保留原有顶部/底部放大）
container.addEventListener('dblclick', e => {
  if (isLoading) return;
  if (zoomed) { zoomOut(); return; }

  const r = container.getBoundingClientRect();
  const y = e.clientY - r.top;
  const h = r.height;
  const top = y < h * 0.05;
  const bottom = y > h * 0.95;

  if (top) zoomToPosition('top');
  else if (bottom) zoomToPosition('bottom');
});

// 原有定点放大（双击顶部/底部使用）
function zoomToPosition(pos) {
  const scale = 2.4;
  let y = 'center';
  if (pos === 'top') y = '11.8%';
  if (pos === 'bottom') y = '80%';
  container.style.transformOrigin = `50% ${y}`;
  container.style.transform = `scale(${scale})`;
  currentScale = scale;
  zoomed = true;
}

// 全局复位（1:1）
function zoomOut() {
  currentScale = 1;
  container.style.transformOrigin = 'center';
  container.style.transform = 'scale(1)';
  zoomed = false;
}

// ========== 连续缩放逻辑（居中，同移动端体验） ==========
function doZoom(increase) {
  // 始终以中心为缩放原点
  container.style.transformOrigin = 'center';
  if (increase) {
    currentScale += scaleStep;
    if (currentScale > maxScale) currentScale = maxScale;
  } else {
    currentScale -= scaleStep;
    if (currentScale < minScale) currentScale = minScale;
  }
  container.style.transform = `scale(${currentScale})`;
  zoomed = currentScale !== 1;
}

// 按钮事件：支持连续点击缩放
zoomInBtn.addEventListener('click', () => doZoom(true));
zoomOutBtn.addEventListener('click', () => doZoom(false));
resetBtn.addEventListener('click', zoomOut);

// 按钮悬浮提示
zoomInBtn.addEventListener('mouseenter', () => {
  const rect = zoomInBtn.getBoundingClientRect();
  showTip(rect.x, rect.y - 40, "放大");
});
zoomOutBtn.addEventListener('mouseenter', () => {
  const rect = zoomOutBtn.getBoundingClientRect();
  showTip(rect.x, rect.y - 40, "缩小");
});
resetBtn.addEventListener('mouseenter', () => {
  const rect = resetBtn.getBoundingClientRect();
  showTip(rect.x, rect.y - 40, "重置 1:1");
});

zoomInBtn.addEventListener('mouseleave', hideTip);
zoomOutBtn.addEventListener('mouseleave', hideTip);
resetBtn.addEventListener('mouseleave', hideTip);

window.onload = () => loadImage(currentVol, currentPage);
</script>

</body>
</html>
