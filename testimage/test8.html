<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>📊 图源优先级适配版</title>
  <style>
    body{font-family:Arial;padding:20px;background:#111;color:#fff}
    .test-box{max-width:800px;margin:0 auto}
    .input-line{margin:10px 0;display:flex;gap:10px;align-items:center}
    input{padding:8px;width:100px;font-size:16px;background:#222;color:#fff;border:1px solid #444}
    button{padding:10px 20px;background:#09c;color:#fff;border:0;border-radius:4px;cursor:pointer}
    .result{margin-top:20px;display:flex;direction:column;gap:12px}
    .item{padding:12px;border-radius:6px;background:#222}
    .item.ok{background:#043A2B}
    .item.no{background:#440000}
    .url{font-size:12px;color:#aaa;margin-top:4px;word-break:break-all}
    img{max-width:100%;max-height:300px;margin-top:10px;border-radius:6px}
    .status-panel{position:fixed;top:10px;right:10px;background:#222;padding:10px;border-radius:6px;font-size:12px;min-width:180px}
    .env-label{color:#0f0;font-weight:bold;margin-bottom:10px}
    
    #debugLog {
      margin-top:30px;
      padding:12px;
      background:#181818;
      border:1px solid #444;
      border-radius:8px;
      height:260px;
      overflow-y:auto;
      font-size:12px;
      font-family:monospace;
      color:#ccc;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
<div class="test-box">
  <h2>📊 图源优先级适配版</h2>
  <div id="envLabel" class="env-label">环境：检测中...</div>

  <div class="input-line">
    卷 <input type="text" id="vol" value="001" readonly>
    页 <input type="text" id="page" value="1" readonly>
    <button onclick="startTest()">🚀 测试当前图源</button>
    <button onclick="randomTest()">🎲 随机一页测试</button>
  </div>

  <div id="volInfo">卷：-- 页：--</div>
  <div id="result" class="result"></div>
  <div id="debugLog"></div>
</div>

<div class="status-panel" id="statusPanel">等待测试...</div>

<script>
let mappingData = null;
let debugLog = document.getElementById('debugLog');

const DISABLE_CACHE = true;
const IMG_TIMEOUT = 10000;

// ==========================
// 工具方法
// ==========================
function log(msg) {
  const now = new Date();
  const time = now.toLocaleTimeString();
  debugLog.innerHTML += `[${time}] ${msg}\n`;
  debugLog.scrollTop = debugLog.scrollHeight;
}

function clearLog() {
  debugLog.innerHTML = "";
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// ==========================
// 1. 环境判断
// ==========================
function getCurrentEnv() {
  const host = location.host.toLowerCase();
  if (host.includes('github.io')) return 'github';
  if (host.includes('daxumi.top')) return 'cloudflare';
  return 'local';
}

// ==========================
// 2. fetch 加载 mapping.js
// ==========================
async function loadMapping(vol) {
  try {
    mappingData = null;
    const vol3 = String(vol).padStart(3, '0');
    const env = getCurrentEnv();
    let url;

    if (env === 'github') {
      url = `/${vol3}/mapping.js`;
    } else {
      url = `https://pub-a0fc4de2782d448f916244913768fb78.r2.dev/${vol3}/mapping.js`;
    }

    if (DISABLE_CACHE) url += '?t=' + Date.now();
    log("--------------------------------------------------");
    log("📥 fetch 加载 mapping: " + url);

    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const text = await res.text();
    log("✅ mapping.js 下载完成");

    const match = text.match(/const\s+mappingData\s*=\s*(\[[\s\S]*?\]);/i);
    if (!match) throw new Error("格式不匹配");

    mappingData = JSON.parse(match[1]);
    log(`✅ 解析成功，共 ${mappingData.length} 条`);
    log("🔍 前10条: " + mappingData.slice(0,10).join(" | "));
    return true;

  } catch (e) {
    log("❌ mapping 失败: " + e.message);
    return false;
  }
}

// ==========================
// 3. 按环境优先级生成图源列表
// ==========================
function buildSources(vol, page) {
  const vol3 = String(vol).padStart(3, '0');
  const pageNum = parseInt(page, 10);
  const env = getCurrentEnv();

  // 基础地址
  const base = {
    r2: { key: "R2", url: `https://pub-a0fc4de2782d448f916244913768fb78.r2.dev/${vol3}/${pageNum}.png` },
    ghAbs: { key: "GitHub绝对", url: `https://abibazhi.github.io/${vol3}/${pageNum}.png` },
    ghRel: { key: "GitHub相对", url: `/${vol3}/${pageNum}.png` },
    imgbb: null
  };

  // 拼接 ImgBB 地址
  if (mappingData && Array.isArray(mappingData)) {
    const idx = pageNum - 1;
    if (idx >= 0 && idx < mappingData.length && mappingData[idx]) {
      const imgbbUrl = `https://i.ibb.co/${mappingData[idx]}/${vol3}-${pageNum}-png.png`;
      base.imgbb = { key: "ImgBB", url: imgbbUrl };
      log(`✅ ImgBB 已生成: ${imgbbUrl}`);
    }
  }

  // 按规则排序
  let sources = [];
  if (env === 'cloudflare') {
    // daxumi.top：R2 > ImgBB > GitHub绝对 > GitHub相对
    sources.push(base.r2);
    if(base.imgbb) sources.push(base.imgbb);
    sources.push(base.ghAbs, base.ghRel);
  } else if (env === 'github') {
    // github.io：GitHub相对 > GitHub绝对 > ImgBB > R2
    sources.push(base.ghRel, base.ghAbs);
    if(base.imgbb) sources.push(base.imgbb);
    sources.push(base.r2);
  } else {
    // 本地环境，默认全量
    sources.push(base.r2, base.ghAbs, base.ghRel);
    if(base.imgbb) sources.push(base.imgbb);
  }

  return sources;
}

// ==========================
// 4. 测试图片
// ==========================
function testImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    const start = Date.now();

    if (url.includes("r2.dev") || url.includes("ibb.co")) {
      img.crossOrigin = "anonymous";
    }

    const timer = setTimeout(() => {
      log(`❌ ${url} | 超时 ${Date.now()-start}ms`);
      resolve(false);
    }, IMG_TIMEOUT);

    img.onload = () => {
      clearTimeout(timer);
      log(`✅ ${url} | 成功 ${Date.now()-start}ms`);
      resolve(true);
    };

    img.onerror = () => {
      clearTimeout(timer);
      log(`❌ ${url} | 失败 ${Date.now()-start}ms`);
      resolve(false);
    };

    img.src = url;
  });
}

// ==========================
// 5. 随机卷页
// ==========================
function randomVolPage() {
  const vol = Math.floor(Math.random() * 167) + 2;
  const page = Math.floor(Math.random() * 600) + 1;
  return { vol, page };
}

// ==========================
// 6. 开始测试
// ==========================
async function startTest() {
  clearLog();
  const env = getCurrentEnv();
  log("🌍 环境: " + env);
  document.getElementById('envLabel').innerText = `环境：${env.toUpperCase()}`;

  const vol = document.getElementById('vol').value;
  const page = document.getElementById('page').value;
  document.getElementById('volInfo').innerText = `卷 ${vol} 页 ${page}`;
  log(`🖼️ 测试 卷${vol} 页${page}`);

  await loadMapping(vol);
  const list = buildSources(vol, page);

  let out = "";
  let status = {};

  // 串行逐个测试，保证优先级顺序展示
  for (const item of list) {
    log("测试: " + item.key);
    const ok = await testImage(item.url);
    status[item.key] = ok ? "✅" : "❌";
    out += `
      <div class="item ${ok ? 'ok' : 'no'}">
        ${item.key}：${ok ? "✅ 正常" : "❌ 失败"}
        <div class="url">${item.url}</div>
        ${ok ? `<img src="${item.url}">` : ""}
      </div>
    `;
  }

  document.getElementById('result').innerHTML = out;
  updateStatus(status);
  log("✅ 测试完成 ✅");
}

// ==========================
// 7. 随机测试
// ==========================
async function randomTest() {
  const { vol, page } = randomVolPage();
  document.getElementById('vol').value = vol;
  document.getElementById('page').value = page;
  await startTest();
}

// ==========================
// 8. 状态面板
// ==========================
function updateStatus(status) {
  const p = document.getElementById('statusPanel');
  p.innerHTML = `
    R2: ${status.R2 || "?"}<br>
    GH绝对: ${status["GitHub绝对"] || "?"}<br>
    GH相对: ${status["GitHub相对"] || "?"}<br>
    ImgBB: ${status.ImgBB || "?"}
  `;
}

window.onload = () => log("页面初始化完成");
</script>
</body>
</html>
