<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
    <style>
        /* 覆盖 github-markdown-css 默认的 padding，让内容更紧凑 */
        .markdown-body {
            padding: 20px 24px;   /* 或者改成 0，你自己调 */
            max-width: 860px;
            margin: 0 auto;
            background: transparent; /* 去掉白色背景，让它透明 */
        }

    </style>
</head>
<body>
<!-- 在页面中放一个容器 -->
<div class="markdown-body" id="about-content"></div>

<!-- 引入 marked 库（CDN） -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- 加载 about.md 并渲染 -->
<script>
  fetch('about.md')
    .then(res => res.text())
    .then(md => {
      document.getElementById('about-content').innerHTML = marked.parse(md);
    });
</script>

</body>
</html>
