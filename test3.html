<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>📊 图源终极调试测试台</title>
  <style>
    body{font-family:Arial;padding:20px;background:#111;color:#fff}
    .test-box{max-width:800px;margin:0 auto}
    .input-line{margin:10px 0;display:flex;gap:10px;align-items:center}
    input{padding:8px;width:100px;font-size:16px;background:#222;color:#fff;border:1px solid #444}
    button{padding:10px 20px;background:#09c;color:#fff;border:0;border-radius:4px;cursor:pointer}
    .result{margin-top:20px;display:flex;flex-direction:column;gap:12px}
    .item{padding:12px;border-radius:6px;background:#222}
    .item.ok{background:#043A2B}
    .item.no{background:#440000}
    .url{font-size:12px;color:#aaa;margin-top:4px;word-break:break-all}
    img{max-width:100%;max-height:300px;margin-top:10px;border-radius:6px}
    .status-panel{position:fixed;top:10px;right:10px;background:#222;padding:10px;border-radius:6px;font-size:12px;min-width:180px}
    .env-label{color:#0f0;font-weight:bold;margin-bottom:10px}
    
    /* 底部调试日志窗口 */
    #debugLog {
      margin-top:30px;
      padding:12px;
      background:#181818;
      border:1px solid #444;
      border-radius:8px;
      height:220px;
      overflow-y:auto;
      font-size:12px;
      font-family:monospace;
      color:#ccc;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
<div class="test-box">
  <h2>📊 图源终极调试测试台</h2>
  <div id="envLabel" class="env-label">环境：检测中...</div>

  <div class="input-line">
    卷 <input type="text" id="vol" value="001" readonly>
    页 <input type="text" id="page" value="1" readonly>
    <button onclick="startTest()">🚀 测试当前图源</button>
    <button onclick="randomTest()">🎲 随机一页测试</button>
  </div>

  <div id="volInfo">卷：-- 页：--</div>
  <div id="result" class="result"></div>

  <!-- 底部调试日志窗口 -->
  <div id="debugLog"></div>
</div>

<div class="status-panel" id="statusPanel">等待测试...</div>

<script>
let mappingData = null;
let debugLog = document.getElementById('debugLog');

// ==========================
// 日志输出函数
// ==========================
function log(msg) {
  console.log(msg);
  debugLog.innerHTML += msg + "\n";
  debugLog.scrollTop = debugLog.scrollHeight;
}

function clearLog() {
  debugLog.innerHTML = "";
}

// ==========================
// 1. 环境判断
// ==========================
function getCurrentEnv() {
  const host = location.host.toLowerCase();
  if (host.includes('github.io')) return 'github';
  if (host.includes('daxumi.top')) return 'cloudflare';
  return 'local';
}

// ==========================
// 2. 加载 mapping.js
// ==========================
async function loadMapping(vol) {
  mappingData = null;
  const vol3 = String(vol).padStart(3, '0');
  const env = getCurrentEnv();
  let url;

  if (env === 'github') {
    url = `/${vol3}/mapping.js`;
  } else {
    url = `https://pub-a0fc4de2782d448f916244913768fb78.r2.dev/${vol3}/mapping.js`;
  }

  log("--------------------------------------------------");
  log("加载 mapping: " + url);

  return new Promise((resolve) => {
    const script = document.createElement('script');
    script.src = url + '?t=' + Date.now();

    script.onload = () => {
      if (typeof window.mappingData !== 'undefined') {
        mappingData = window.mappingData;
        log("✅ mapping 加载成功");
        log("   类型: " + typeof mappingData);
        log("   是否数组: " + Array.isArray(mappingData));
        if (Array.isArray(mappingData)) {
          log("   长度: " + mappingData.length);
          log("   前10项: " + mappingData.slice(0,10).join(" | "));
        }
      } else {
        log("❌ mapping 加载成功，但 window.mappingData 未定义");
      }
      resolve(true);
    };

    script.onerror = () => {
      log("❌ mapping 加载失败");
      resolve(false);
    };

    document.head.appendChild(script);
    setTimeout(() => resolve(false), 5000);
  });
}

// ==========================
// 3. 生成图源
// ==========================
function buildSources(vol, page) {
  const vol3 = String(vol).padStart(3, '0');
  const pageNum = parseInt(page, 10);

  const sources = [
    { key: "R2", url: `https://pub-a0fc4de2782d448f916244913768fb78.r2.dev/${vol3}/${pageNum}.png` },
    { key: "GitHub绝对", url: `https://abibazhi.github.io/${vol3}/${pageNum}.png` },
    { key: "GitHub相对", url: `/${vol3}/${pageNum}.png` }
  ];

  if (mappingData && Array.isArray(mappingData)) {
    const idx = pageNum - 1;
    if (idx >= 0 && idx < mappingData.length && mappingData[idx]) {
      const imgbbUrl = `https://i.ibb.co/${mappingData[idx]}/${vol3}-${pageNum}-png.png`;
      sources.push({ key: "ImgBB", url: imgbbUrl });
      log(`✅ ImgBB 已生成: ${imgbbUrl}`);
    } else {
      log(`❌ 当前页 ${pageNum} 无 ImgBB 数据 (idx=${idx})`);
    }
  } else {
    log("⚠️ mapping 无效，跳过 ImgBB");
  }

  return sources;
}

// ==========================
// 4. 测试图片
// ==========================
function testImage(url) {
  return new Promise(resolve => {
    const img = new Image();
    const timer = setTimeout(() => resolve(false), 5000);
    img.onload = () => { clearTimeout(timer); resolve(true); };
    img.onerror = () => { clearTimeout(timer); resolve(false); };
    if (url.startsWith("http")) img.crossOrigin = "anonymous";
    img.src = url;
  });
}

// ==========================
// 5. 随机卷页
// ==========================
function randomVolPage() {
  const vol = Math.floor(Math.random() * 167) + 2;
  const page = Math.floor(Math.random() * 600) + 1;
  return { vol, page };
}

// ==========================
// 6. 开始测试
// ==========================
async function startTest() {
  clearLog();
  const env = getCurrentEnv();
  document.getElementById('envLabel').innerText = `当前环境：${env.toUpperCase()}`;
  log("🌍 环境: " + env);

  const vol = document.getElementById('vol').value;
  const page = document.getElementById('page').value;
  document.getElementById('volInfo').innerText = `测试：卷 ${vol} / 页 ${page}`;
  log(`🖼️ 测试卷 ${vol} 页 ${page}`);

  const res = document.getElementById('result');
  res.innerHTML = "加载中...";

  await loadMapping(vol);
  const list = buildSources(vol, page);

  let output = "";
  let status = {};

  for (const item of list) {
    log("测试: " + item.key + " -> " + item.url);
    const ok = await testImage(item.url);
    status[item.key] = ok ? "✅" : "❌";
    output += `
      <div class="item ${ok ? 'ok' : 'no'}">
        ${item.key}：${ok ? "✅ 正常" : "❌ 失败"}
        <div class="url">${item.url}</div>
        ${ok ? `<img src="${item.url}">` : ""}
      </div>
    `;
  }

  res.innerHTML = output;
  updateStatus(status);
  log("✅ 测试完成");
}

// ==========================
// 7. 随机测试
// ==========================
async function randomTest() {
  const { vol, page } = randomVolPage();
  document.getElementById('vol').value = vol;
  document.getElementById('page').value = page;
  await startTest();
}

// ==========================
// 8. 状态面板
// ==========================
function updateStatus(status) {
  const p = document.getElementById('statusPanel');
  p.innerHTML = `
    R2: ${status.R2 || "?"}<br>
    GH绝对: ${status["GitHub绝对"] || "?"}<br>
    GH相对: ${status["GitHub相对"] || "?"}<br>
    ImgBB: ${status.ImgBB || "?"}
  `;
}

window.onload = () => {
  const env = getCurrentEnv();
  document.getElementById('envLabel').innerText = `当前环境：${env.toUpperCase()}`;
  log("页面加载完成");
};
</script>
</body>
</html>
