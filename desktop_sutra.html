<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>乾隆大藏经图片浏览</title>

  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #zoomImage {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .loading-indicator {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      display: none;
    }

    .source-badge {
      position: absolute;
      bottom: 80px; right: 80px;
      background: rgba(0,0,0,0.6);
      color: #0f0;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 100;
      transition: background 0.2s;
    }
    .source-badge.erratum-warn {
      background: rgba(192, 57, 43, 0.85);
      color: #fff;
      cursor: pointer;
    }
    .source-badge.erratum-warn-missing {
      background: rgba(230, 126, 34, 0.85);
      color: #fff;
      cursor: pointer;
    }

    .controls {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 12px;
      z-index: 999;
    }
    .control-btn {
      width: 48px; height: 48px;
      border-radius: 50%; border: none;
      background: rgba(0,0,0,0.6);
      color: white; font-size: 20px;
      cursor: pointer;
    }

    /* 🆕 优化 hover 提示样式 - 方案一：深色 + 金色边框 */
    .hover-tooltip {
      position: fixed;
      background: rgba(20, 20, 30, 0.92);
      color: #f0f0f0;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      width: auto;
      max-width: min(480px, calc(100vw - 20px));
      white-space: pre-wrap; /* 保留换行 */
      line-height: 1.8;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border: 2px solid #f39c12; /* 金色边框 */
      word-break: break-word;
    }

    /* 勘误专用：红色边框更醒目 */
    .hover-tooltip.erratum-tip {
      border-color: #e74c3c;
      background: rgba(30, 10, 10, 0.92);
    }

    /* 多行模式（其实现在都用 pre-wrap 了） */
    .hover-tooltip.multiline {
      white-space: pre-wrap;
      max-width: min(480px, calc(100vw - 20px));
      padding: 10px 18px;
    }

    .hover-tooltip.thanks-mode {
      padding: 0;
      display: grid;
      grid-template-columns: auto 1fr auto;
      min-width: 12em;
      border-color: #f39c12; /* 感谢信息用金色边框 */
    }



    .thanks-row {
      line-height: 1.8;
    }
    .thanks-row.full {
      grid-column: 1 / -1;
      text-align: center;
    }
    .thanks-row.middle.thanks-text {
      text-align: center;
    }

    #floatTip {
      position: fixed;
      top: 30px; left: 50%;
      transform: translateX(-50%);
      background: #c0392b;
      color: #fff;
      padding: 8px 20px;
      border-radius: 4px;
      z-index: 10000;
      display: none;
    }

    .icon-badge {
      background: transparent !important;
      padding: 0 !important;
      border-radius: 0 !important;
      font-size: 1.5em;
      line-height: 1;
      cursor: pointer;
    }

  </style>

  <script type="module" src="./js/utils.js"></script>
  <script type="module" src="./js/pageNav.js" charset="UTF-8"></script>
  <script type="module" src="./js/imageLoader.js"></script>
</head>
<body>

<div class="container" id="imageContainer">
  <img id="zoomImage" alt="经文">
  <div id="loadingIndicator" class="loading-indicator">加载中...</div>
  <div id="sourceBadge" class="source-badge">---</div>
</div>

<div class="controls">
  <button class="control-btn" id="zoomOutBtn">-</button>
  <button class="control-btn" id="resetBtn">1:1</button>
  <button class="control-btn" id="zoomInBtn">+</button>
</div>

<div id="hoverTip" class="hover-tooltip">提示</div>
<div id="floatTip"></div>

<script type="module">
import { getBestImageUrl } from './js/imageLoader.js';
import { currentVol, currentPage, calcNextPage, setCurrentPage } from './js/pageNav.js';
import { erratumPicData } from './erratum/data/erratum.json.js';

// ============================================================
// 勘误提示功能
// ============================================================
const activeErrataMap = new Map(); 
let lastVolume = null;

erratumPicData.groups.forEach(group => {
  group.items.forEach(item => {
    const effectiveVol = item.volume !== null ? item.volume : lastVolume;
    if (item.volume !== null) {
      lastVolume = item.volume; 
    }

    if (item.page !== "目錄" && item.page !== "" &&
        ((item.correction && item.correction.length <= 3) ||
         (item.verifyNote && item.verifyNote.includes('加提醒')))) {

      const key = `${effectiveVol}_${item.page}`; 
      if (!activeErrataMap.has(key)) {
        activeErrataMap.set(key, []);
      }
      activeErrataMap.get(key).push(item);
    }
  });
});

function checkErratum(vol, page) {
  const volNum = parseInt(vol, 10);
  const pageNum = parseInt(page, 10);
  if (isNaN(volNum) || isNaN(pageNum)) return null;
  return activeErrataMap.get(`${volNum}_${pageNum}`);
}

function formatErratumText1(items) {
  if (!items || items.length === 0) return '';
  
  const allSameSection = items.every(item => item.section === items[0].section);
  
  function formatItem(item) {
    return `${item.location} → ${item.correction}`;
  }
  
  if (items.length === 1) {
    const item = items[0];
    const sectionText = item.section ? `（${item.section}栏）` : '';
    return `勘误${sectionText}：${formatItem(item)}`;
  }
  
  if (allSameSection) {
    const sectionText = items[0].section ? `（${items[0].section}栏）` : '';
    const parts = items.map((item, i) => `${i + 1}. ${formatItem(item)}`);
    return `勘误${sectionText}：${parts.join(' ')}`;
  }
  
  const parts = items.map((item, i) => {
    const sectionText = item.section ? `（${item.section}栏）` : '';
    return `${i + 1}. ${sectionText}${formatItem(item)}`;
  });
  return `勘误：${parts.join(' ')}`;
}

  // 🆕 简化后的 formatErratumText
  function formatErratumText(items) {
    if (!items || items.length === 0) return '';
    
    // 每条勘误独立一行
    const parts = items.map((item, i) => {
      const correctionText = item.correction || item.verifyNote || '待确认';
      const sectionText = item.section ? `（${item.section}栏）` : '';
      return `${i + 1}. ${sectionText}「${item.location}」→ ${correctionText}`;
    });
    
    return `📌 本页勘误信息：\n${parts.join('\n')}`;
  }

  // 🆕 显示勘误提示时加上特殊 class
  function showErratumTip(x, y, text) {
    hoverTip.classList.remove('thanks-mode');
    hoverTip.classList.add('erratum-tip'); // 红色边框
    hoverTip.style.left = x + 'px';
    hoverTip.style.top = y + 'px';
    hoverTip.textContent = text;
    hoverTip.style.opacity = 1;
  }

  // 修改 showTip，根据内容决定样式
  function showTip(x, y, text) {
    hoverTip.classList.remove('thanks-mode', 'erratum-tip');
    hoverTip.style.left = x + 'px';
    hoverTip.style.top = y + 'px';
    hoverTip.textContent = text;
    hoverTip.style.opacity = 1;
  }


let isLoading = false;
let panzoom = null;
const edgeThreshold = 0.05;

const container = document.getElementById('imageContainer');
const img = document.getElementById('zoomImage');
const loadingIndicator = document.getElementById('loadingIndicator');
const sourceBadge = document.getElementById('sourceBadge');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const resetBtn = document.getElementById('resetBtn');
const hoverTip = document.getElementById('hoverTip');
const floatTip = document.getElementById('floatTip');

function showTempTip(msg, duration = 2000) {
  floatTip.textContent = msg;
  floatTip.style.display = 'block';
  setTimeout(() => floatTip.style.display = 'none', duration);
}



// 🆕 优化 showTip：自动判断单行/多行
function showTip1(x, y, text) {
  hoverTip.classList.remove('thanks-mode', 'multiline');
  hoverTip.style.left = x + 'px';
  hoverTip.style.top = y + 'px';
  hoverTip.textContent = text;
  
  // 如果文字超过 35 个字符，允许换行（多行显示）
  if (text && text.length > 35) {
    hoverTip.classList.add('multiline');
  }
  
  hoverTip.style.opacity = 1;
}


  // 🆕 智能定位的 showTip 函数
  function showTip(x, y, text) {
    hoverTip.classList.remove('thanks-mode', 'multiline');
    hoverTip.textContent = text;
    
    // 判断是否多行
    if (text && text.length > 35) {
      hoverTip.classList.add('multiline');
    }
    
    // 先设置一个临时位置，让浏览器计算尺寸
    hoverTip.style.left = '0px';
    hoverTip.style.top = '0px';
    hoverTip.style.opacity = 1;
    
    // 等布局完成后精确定位
    requestAnimationFrame(() => {
      const rect = hoverTip.getBoundingClientRect();
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const padding = 10;
      
      // 默认在鼠标上方
      let left = x;
      let top = y - rect.height - 10;
      
      // 水平方向调整
      if (left + rect.width > vw - padding) {
        left = vw - rect.width - padding;
      }
      if (left < padding) {
        left = padding;
      }
      
      // 垂直方向调整
      if (top < padding) {
        top = y + 20; // 放到鼠标下方
      }
      if (top + rect.height > vh - padding) {
        top = vh - rect.height - padding;
      }
      
      hoverTip.style.left = left + 'px';
      hoverTip.style.top = top + 'px';
    });
  }




function showThanksTip(x, y, provider) {
  hoverTip.classList.add('thanks-mode');
  hoverTip.style.left = x + 'px';
  hoverTip.style.top = y + 'px';
  hoverTip.innerHTML =
    '<div class="thanks-row full">🌸🌸🌸🌸🌸🌸🌸🌸🌸</div>' +
    '<div class="thanks-row middle">🌸</div>' +
    '<div class="thanks-row middle thanks-text">感谢</div>' +
    '<div class="thanks-row middle">🌸</div>' +
    '<div class="thanks-row middle">🌸</div>' +
    '<div class="thanks-row middle thanks-text">' + provider + '</div>' +
    '<div class="thanks-row middle">🌸</div>' +
    '<div class="thanks-row middle">🌸</div>' +
    '<div class="thanks-row middle thanks-text">提供免费存储</div>' +
    '<div class="thanks-row middle">🌸</div>' +
    '<div class="thanks-row full">🌸🌸🌸🌸🌸🌸🌸🌸🌸</div>';
  hoverTip.style.opacity = 1;
}

  // showThanksTip 也稍作调整
  function showThanksTip1(x, y, provider) {
    hoverTip.classList.add('thanks-mode');
    hoverTip.style.left = '0px';
    hoverTip.style.top = '0px';
    hoverTip.innerHTML =
      '<div class="thanks-row full">🌸🌸🌸🌸🌸🌸🌸🌸🌸</div>' +
      '<div class="thanks-row middle">🌸</div>' +
      '<div class="thanks-row middle thanks-text">感谢</div>' +
      '<div class="thanks-row middle">🌸</div>' +
      '<div class="thanks-row middle">🌸</div>' +
      '<div class="thanks-row middle thanks-text">' + provider + '</div>' +
      '<div class="thanks-row middle">🌸</div>' +
      '<div class="thanks-row middle">🌸</div>' +
      '<div class="thanks-row middle thanks-text">提供免费存储</div>' +
      '<div class="thanks-row middle">🌸</div>' +
      '<div class="thanks-row full">🌸🌸🌸🌸🌸🌸🌸🌸🌸</div>';
    
    // 同样做智能定位
    requestAnimationFrame(() => {
      const rect = hoverTip.getBoundingClientRect();
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const padding = 10;
      
      let left = x;
      let top = y - rect.height - 10;
      
      if (left + rect.width > vw - padding) {
        left = vw - rect.width - padding;
      }
      if (left < padding) {
        left = padding;
      }
      if (top < padding) {
        top = y + 20;
      }
      if (top + rect.height > vh - padding) {
        top = vh - rect.height - padding;
      }
      
      hoverTip.style.left = left + 'px';
      hoverTip.style.top = top + 'px';
    });
  }


function hideTip() { hoverTip.style.opacity = 0; }

function initPanzoom() {
  panzoom = Panzoom(img, {
    maxScale: 5,
    minScale: 1,
    step: 0.15,
    cursor: 'grab',
    pinchAndZoom: true,
    events: {
      mouseWheel: false
    },
    transformOrigin: { x: 0.5, y: 0.5 }
  });

  container.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1 : -1;
    const step = 0.15;
    const newScale = panzoom.getScale() + delta * step;
    panzoom.zoom(newScale, { focal: { x: 0.5, y: 0.5 } });
  });
}

function showLoading() { isLoading = true; loadingIndicator.style.display = 'block'; }
function hideLoading() { isLoading = false; loadingIndicator.style.display = 'none'; }

const thanksMap = {
  'R2': 'Cloudflare',
  'ImgBB': 'ImgBB',
  'GitHub': 'GitHub'
};

async function loadImage(vol, page) {
  showLoading();
  try {
    const best = await getBestImageUrl(vol, page);
    if (best) {
      img.src = best.url;
      sourceBadge.textContent = best.key;
    } else {
      img.src = '';
      sourceBadge.textContent = '失败';
    }
    const erratum = checkErratum(vol, page);
    if (erratum) {
      const hasMissing = erratum.some(item => item.verifyNote && item.verifyNote.includes('缺行'));
      sourceBadge.innerHTML = '📌'; 
      sourceBadge.classList.remove('erratum-warn', 'erratum-warn-missing');
      sourceBadge.classList.add('icon-badge');
      sourceBadge.classList.add(hasMissing ? 'erratum-warn-missing' : 'erratum-warn');
      sourceBadge.dataset.hoverText = '点击显示';
      sourceBadge.dataset.erratumText = formatErratumText(erratum);
      
      showTempTip('📌 本页有勘误信息', 2000);
      
    } else {
      sourceBadge.classList.remove('erratum-warn', 'erratum-warn-missing');
      sourceBadge.classList.add('icon-badge');
      sourceBadge.innerHTML = '🪷';
      sourceBadge.dataset.hoverText = thanksMap[best?.key] || '';
      sourceBadge.dataset.erratumText = '';
    }
  } catch (e) { console.error(e); }
  hideLoading();
  panzoom.reset();
}

async function changeImage(direction) {
  if (isLoading || panzoom.getScale() > 1) return;
  const res = calcNextPage(direction);
  if (!res.ok) return showTempTip(direction > 0 ? "最后一页" : "第一页");
  const { newVol, newPage } = res;
  await loadImage(newVol, newPage);
  setCurrentPage(newVol, newPage);
}

container.addEventListener('mousemove', e => {
  const scale = panzoom.getScale();
  if (scale > 1) return hideTip();

  if (e.target === sourceBadge || sourceBadge.contains(e.target)) return;

  const r = container.getBoundingClientRect();
  const x = e.clientX - r.left;
  const w = r.width;

  if (x < w * edgeThreshold) {
    showTip(e.clientX, e.clientY - 30, "← 上一页");
  } else if (x > w * (1 - edgeThreshold)) {
    showTip(e.clientX, e.clientY - 30, "下一页 →");
  } else {
    hideTip();
  }
});
container.addEventListener('mouseleave', hideTip);

container.addEventListener('click', e => {
  const scale = panzoom.getScale();
  if (scale > 1) return;
  const r = container.getBoundingClientRect();
  const x = e.clientX - r.left;
  const w = r.width;
  if (x < w * edgeThreshold) changeImage(-1);
  else if (x > w * (1 - edgeThreshold)) changeImage(1);
});

zoomInBtn.onclick = () => panzoom.zoomIn();
zoomOutBtn.onclick = () => panzoom.zoomOut();
resetBtn.onclick = () => panzoom.reset();

zoomInBtn.onmouseenter = () => showTip(zoomInBtn.getBoundingClientRect().x, zoomInBtn.getBoundingClientRect().y-40, "放大");
zoomOutBtn.onmouseenter = () => showTip(zoomOutBtn.getBoundingClientRect().x, zoomOutBtn.getBoundingClientRect().y-40, "缩小");
resetBtn.onmouseenter = () => showTip(resetBtn.getBoundingClientRect().x, resetBtn.getBoundingClientRect().y-40, "重置 1:1");
zoomInBtn.onmouseleave = zoomOutBtn.onmouseleave = resetBtn.onmouseleave = hideTip;

sourceBadge.addEventListener1('mouseenter', e => {
  if (sourceBadge.dataset.erratumText) {
    const r = sourceBadge.getBoundingClientRect();
    showTip(r.left, r.top - 36, sourceBadge.dataset.erratumText);
  } else if (sourceBadge.dataset.hoverText) {
    const r = sourceBadge.getBoundingClientRect();
    showThanksTip(r.left - 70, r.top - 140, sourceBadge.dataset.hoverText);
  }
});

  // ... 在 sourceBadge hover 事件中调用 showErratumTip
  sourceBadge.addEventListener('mouseenter', e => {
    if (sourceBadge.dataset.erratumText) {
      const r = sourceBadge.getBoundingClientRect();
      // 🆕 使用专门的勘误显示函数
      showErratumTip(r.left, r.top - 36, sourceBadge.dataset.erratumText);
    } else if (sourceBadge.dataset.hoverText) {
      const r = sourceBadge.getBoundingClientRect();
      showThanksTip(r.left - 70, r.top - 140, sourceBadge.dataset.hoverText);
    }
  });


sourceBadge.addEventListener('mouseleave', hideTip);

sourceBadge.addEventListener('click', e => {
  if (sourceBadge.dataset.erratumText) {
    e.stopPropagation();
    showTempTip('📌 请悬停查看完整勘误详情', 1500);
  }
});

window.onload = () => {
  initPanzoom();
  loadImage(currentVol, currentPage);
};
</script>
<script src="js/tongji.baidu.js"></script>
</body>
</html>
