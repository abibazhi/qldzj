<!-- 在页面中放一个容器 -->
<div id="about-content"></div>

<!-- 引入 marked 库（CDN） -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- 加载 about.md 并渲染 -->
<script>
  fetch('about.md')
    .then(res => res.text())
    .then(md => {
      document.getElementById('about-content').innerHTML = marked.parse(md);
    });
</script>
