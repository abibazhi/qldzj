  <style>

      position: relative;
      width: 100%;

      transform-origin: center center;
      transition: transform 0.2s ease-out;

    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      pointer-events: none;

    .loading-indicator {
      position: absolute;

      transform: translate(-50%, -50%);

    }

    .error-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 0, 0, 0.7);
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      z-index: 10;
      display: none;
    }

    .page-info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      z-index: 10;
    }

    .controls {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    .control-btn {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      cursor: pointer;
    }

    .source-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.5);
      color: #0f0;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      z-index: 20;
      pointer-events: none;
    }
  </style>
<script>

<body>

<div class="container">
  <div class="image-wrapper" id="imageWrapper">
    <img id="imageView" src="" alt="乾隆大藏经图片"/>
  </div>
  <div class="loading-indicator" id="loadingIndicator">加载中...</div>
  <div class="error-message" id="errorMessage">图片加载失败</div>
  <div class="page-info" id="pageInfo"></div>
  <div class="source-badge" id="sourceBadge">---</div>

  <div class="controls">
    <button class="control-btn" id="zoomOutBtn">-</button>
    <button class="control-btn" id="resetBtn">1:1</button>
    <button class="control-btn" id="zoomInBtn">+</button>

<script>
  // ========== 配置区域 ==========
  // 是否优先使用 ImgBB（true=优先ImgBB，失败回退本地；false=直接本地）
  const PREFER_IMGBB = true;
  
  // ImgBB 图片 URL 模板：{vol} 和 {page} 会被替换
  // 注意：你上传的文件名格式是 {vol}_{page}.png，例如 001_001.png
  const IMGBB_URL_TEMPLATE = 'https://i.ibb.co/{path}';
  
  // 由于 ImgBB 的链接是随机ID + 文件名，我们需要一个映射表
  // 但你有 13 万张图片，不可能在前端放映射表
  // 所以方案改为：通过后端代理或预先生成映射文件
  
  // ========== 方案A：如果你有一个映射文件（推荐） ==========
  // 你可以用脚本生成一个映射 JSON 文件，例如 mapping.json
  // 格式：{ "001_001": "https://i.ibb.co/xxx/001-1-png.png", ... }
  // 然后前端加载这个映射文件
  
  // ========== 方案B：直接用 ImgBB 的命名规则 ==========
  // 根据你之前的测试，ImgBB 会将文件名中的下划线转成短横线，并加上 -png 后缀
  // 例如：上传时指定 name=001_1.png，最终链接是 https://i.ibb.co/xxx/001-1-png.png
  // 但前面的随机ID无法预测，所以无法直接构造链接
  
  // ========== 方案C：使用你自己的后端代理（最灵活） ==========
  // 在你的服务器上做一个代理接口，根据册号和页码返回正确的 ImgBB 链接
  // 这个代理可以读取你生成的映射表（约 13 万条记录）
  
  // 由于你没有提供映射表，我先给你一个**通过本地映射文件**的完整方案
  // 你需要先用脚本生成 mapping.json（见下方说明）
  
  // ========== 临时方案：直接从本地加载 ==========
  // 如果你暂时不想折腾，可以直接使用本地路径
  // 下面的代码已经做好了回退机制，你可以配置加载方式
  
  // 配置加载策略
  // 'local': 只从本地加载
  // 'imgbb': 只从 ImgBB 加载（需要映射文件）
  // 'fallback': 优先 ImgBB，失败回退本地（需要映射文件）
  let LOAD_STRATEGY = 'imgbb';  // 改为 'fallback' 启用 ImgBB 优先加载
  
  // 映射表缓存（从服务器加载）
  //let urlMapping = null;
  //document.addEventListener('DOMContentLoaded', function() {
  //  urlMapping = mappingData;
  //});

  // 动态加载当前卷的 mapping.js（防重复加载）
  async function loadMappingForVolume(vol) {
    // 防止重复加载，避免报错
    const exists = document.querySelector(`script[src="/${vol}/mapping.js"]`);
    if (exists) return;

    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = `/${vol}/mapping.js`;
      script.onload = resolve;
      script.onerror = reject;
      document.body.appendChild(script);
    });
  }
    
  // 当前图片来源标识
  let currentSource = 'local';
  
  function getQueryVariable(variable) {
    const query = window.location.search.substring(1);
    const vars = query.split('&');
    for (let i = 0; i < vars.length; i++) {
      const pair = vars[i].split('=');
      if (pair[0] === variable) return decodeURIComponent(pair[1]);
    }
    return false;
  }
  
  // 获取URL参数
  const startParam = getQueryVariable('start') || '001001';
  const endParam = getQueryVariable('end') || '999999';
  
  function parseParam(param) {
    if (!/^\d+$/.test(param)) {
      return { vol: 1, page: 1 };
    }
    if (param.length === 6) {
      return {
        vol: parseInt(param.slice(0, 3), 10),
        page: parseInt(param.slice(3, 6), 10)
      };
    } else if (param.length === 7) {
      return {
        vol: parseInt(param.slice(0, 3), 10),
        page: parseInt(param.slice(3, 7), 10)
      };
    } else {
      return { vol: 1, page: 1 };
    }
  }
  
  const startData = parseParam(startParam);
  const endData = parseParam(endParam);
  
  let currentVol = startData.vol;
  let currentPage = startData.page;
  
  const startVol = startData.vol;
  const startPage = startData.page;
  const endVol = endData.vol;
  const endPage = endData.page;
  
  // 缩放和拖拽相关变量
  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let lastScaleDistance = 0;
  let isLoading = false;
  let touchMode = null;
  let startX = 0, startY = 0;
  let startTranslateX = 0, startTranslateY = 0;
  let startTime = 0;
  let scaleFactor = 1.1;
  let zoomSensitivity = 0.1;
  let dragSpeedFactor = 1.5;
  
  const imageWrapper = document.getElementById('imageWrapper');
  const imageView = document.getElementById('imageView');
  const loadingIndicator = document.getElementById('loadingIndicator');
  const errorMessage = document.getElementById('errorMessage');
  const pageInfo = document.getElementById('pageInfo');
  const sourceBadge = document.getElementById('sourceBadge');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const resetBtn = document.getElementById('resetBtn');
  
  function showLoading() {
    if (isLoading) return;
    isLoading = true;
    loadingIndicator.style.display = 'block';
    errorMessage.style.display = 'none';
  }
  
  function hideLoading() {
    isLoading = false;
    loadingIndicator.style.display = 'none';
  }
  
  function showError(message) {
    errorMessage.textContent = message;
    errorMessage.style.display = 'block';
    setTimeout(() => {
      errorMessage.style.display = 'none';
    }, 3000);
  }
  
  function updatePageInfo() {
    const volFormatted = String(currentVol).padStart(3, '0');
    pageInfo.textContent = `第 ${currentVol} 册 第 ${currentPage} 页`;
  }
  
  function updateTransform() {
    imageWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
  }
  
  // 获取本地图片路径
  function getLocalImageUrl(vol, page) {
    const volFormatted = String(vol).padStart(3, '0');
    return `/qldzj/pngs/${volFormatted}/${page}.png`;
  }
  
  // 获取 ImgBB 图片路径（通过映射表）
  function getImgbbrl1(vol, page) {
    if (!urlMapping) return null;
    const key = `${String(vol).padStart(3, '0')}_${page}`;
    return urlMapping[key] || null;
  }

  function getImgbbrl(vol, page) {
    if (!urlMapping) return null;
    // const key = `${String(vol).padStart(3, '0')}_${page}`;
    // const randomId = urlMapping[key];
    // 🔥 新数组取值方式
    const volNum = parseInt(vol, 10);
    const pageNum = parseInt(page, 10);
    if (!urlMapping[volNum] || !urlMapping[volNum][pageNum - 1]) return null;

    const randomId = urlMapping[volNum][pageNum - 1];
    
    if (!randomId) return null;
    
    // 拼接完整 URL
    // 注意：ImgBB 的文件名格式是 {册号}-{页码}-png.png
    const filename = `${String(vol).padStart(3, '0')}-${page}-png.png`;
    return `https://i.ibb.co/${randomId}/${filename}`;
  }


  
  // 加载映射表（首次加载时调用）
  /*
  async function loadMapping() {
    if (LOAD_STRATEGY === 'local') return;
    
    try {
      const response = await fetch('/qldzj/mapping.json.gz?v=1');
      if (response.ok) {
	const text = await response.text(); // 👈 能正确读取并解压
        urlMapping = JSON.parse(text);      // 👈 再转成对象
        // urlMapping = await response.json();
        console.log(`✅ 加载映射表成功，共 ${Object.keys(urlMapping).length} 条记录`);
      } else {
        console.warn('⚠️ 映射表加载失败，将只使用本地图片');
        LOAD_STRATEGY = 'local';
      }
    } catch (err) {
      console.warn('⚠️ 映射表加载异常:', err);
      LOAD_STRATEGY = 'local';
    }
  }
  */

  // 动态加载当前卷的 mapping.js（防重复加载）
  async function loadMappingForVolume(vol) {
    // 防止重复加载，避免报错
    const exists = document.querySelector(`script[src="/${vol}/mapping.js"]`);
    if (exists) return;

    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = `/${vol}/mapping.js`;
      script.onload = resolve;
      script.onerror = reject;
      document.body.appendChild(script);
    });
  }
    
  // 带回退的图片加载
  async function loadImage(vol, page) {

    await loadMappingForVolume(vol);

    showLoading();

    
    const strategies = [];
    
    if (LOAD_STRATEGY === 'fallback') {
      // 优先 ImgBB，回退本地
      strategies.push({ type: 'imgbb', url: getImgbbrl(vol, page) });
      strategies.push({ type: 'local', url: getLocalImageUrl(vol, page) });
    } else if (LOAD_STRATEGY === 'imgbb') {
      // 仅 ImgBB
      strategies.push({ type: 'imgbb', url: getImgbbrl(vol, page) });
    } else {
      // 仅本地
      strategies.push({ type: 'local', url: getLocalImageUrl(vol, page) });
    }
    
    updatePageInfo();
    
    for (const strategy of strategies) {
      if (!strategy.url) continue;
      
      try {
        const result = await tryLoadImage(strategy.url);
        if (result.success) {
          currentSource = strategy.type === 'imgbb' ? 'ImgBB' : '本地';
          sourceBadge.textContent = currentSource;
          sourceBadge.style.color = strategy.type === 'imgbb' ? '#0f0' : '#ff0';
          hideLoading();
          resetView();
          return;
        }
        console.warn(`${strategy.type} 加载失败: ${strategy.url}`);
      } catch (err) {
        console.warn(`${strategy.type} 加载异常:`, err);
      }
    }
    
    hideLoading();
    showError('所有图片来源均加载失败');
  }
  
  // 尝试加载单张图片（返回 Promise）
  function tryLoadImage(url) {
    return new Promise((resolve) => {
      const img = new Image();
      const timeout = setTimeout(() => {
        img.onload = null;
        img.onerror = null;
        resolve({ success: false, error: 'timeout' });
      }, 10000);
      
      img.onload = () => {
        clearTimeout(timeout);
        imageView.src = url;
        resolve({ success: true });
      };
      
      img.onerror = () => {
        clearTimeout(timeout);
        resolve({ success: false, error: 'load error' });
      };
      
      img.src = url;
    });
  }
  
  async function changeImage(direction) {
    if (isLoading) return;
    
    let newVol = currentVol;
    let newPage = currentPage + direction;
    
    if (direction > 0) {
      if (newPage > 9999) {
        newPage = 1;
        newVol += 1;
      }
    } else {
      if (newPage < 1) {
        newPage = 9999;
        newVol -= 1;
      }
    }
    
    if (newVol < startVol || (newVol === startVol && newPage < startPage)) {
      showError('已经是第一页');
      return;
    }
    
    if (newVol > endVol || (newVol === endVol && newPage > endPage)) {
      showError('已经是最后一页');
      return;
    }
    
    if (newVol < 1) {
      showError('已经是第一页');
      return;
    }
    
    const prevVol = currentVol;
    const prevPage = currentPage;
    
    currentVol = newVol;
    currentPage = newPage;
    
    try {
      await loadImage(currentVol, currentPage);
    } catch (err) {
      currentVol = prevVol;
      currentPage = prevPage;
      showError(err.message);
    }
  }
  
  function zoomAtCenter(centerX, centerY, scaleRatio) {
    const oldScale = scale;
    scale = Math.max(1, Math.min(5, scale * scaleRatio));
    
    translateX = centerX - ((centerX - translateX) * (scale / oldScale));
    translateY = centerY - ((centerY - translateY) * (scale / oldScale));
    
    const maxTranslateX = (scale - 1) * window.innerWidth / 2;
    const maxTranslateY = (scale - 1) * window.innerHeight / 2;
    
    translateX = Math.max(-maxTranslateX, Math.min(maxTranslateX, translateX));
    translateY = Math.max(-maxTranslateY, Math.min(maxTranslateY, translateY));
    
    updateTransform();
  }
  
  function resetView() {
    scale = 1;
    translateX = 0;
    translateY = 0;
    updateTransform();
  }
  
  // 触摸事件处理
  imageWrapper.addEventListener('touchstart', (event) => {
    if (event.touches.length === 2) {
      touchMode = 'scale';
      const dx = event.touches[0].clientX - event.touches[1].clientX;
      const dy = event.touches[0].clientY - event.touches[1].clientY;
      lastScaleDistance = Math.sqrt(dx * dx + dy * dy);
      startTranslateX = translateX;
      startTranslateY = translateY;
    } else if (event.touches.length === 1) {
      if (scale > 1.0) {
        touchMode = 'drag';
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
        startTranslateX = translateX;
        startTranslateY = translateY;
      } else {
        touchMode = 'swipe';
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
        startTime = Date.now();
      }
    }
  });
  
  imageWrapper.addEventListener('touchmove', (event) => {
    if (touchMode === 'scale' && event.touches.length === 2) {
      event.preventDefault();
      const dx = event.touches[0].clientX - event.touches[1].clientX;
      const dy = event.touches[0].clientY - event.touches[1].clientY;
      const currentDistance = Math.sqrt(dx * dx + dy * dy);
      const scaleRatio = 1 + (currentDistance / lastScaleDistance - 1) * zoomSensitivity;
      const centerX = (event.touches[0].clientX + event.touches[1].clientX) / 2;
      const centerY = (event.touches[0].clientY + event.touches[1].clientY) / 2;
      zoomAtCenter(centerX, centerY, scaleRatio);
      lastScaleDistance = currentDistance;
    } else if (touchMode === 'drag' && event.touches.length === 1) {
      event.preventDefault();
      const currentX = event.touches[0].clientX;
      const currentY = event.touches[0].clientY;
      translateX = startTranslateX + (currentX - startX) * dragSpeedFactor;
      translateY = startTranslateY + (currentY - startY) * dragSpeedFactor;
      const maxTranslateX = (scale - 1) * window.innerWidth / 2;
      const maxTranslateY = (scale - 1) * window.innerHeight / 2;
      translateX = Math.max(-maxTranslateX, Math.min(maxTranslateX, translateX));
      translateY = Math.max(-maxTranslateY, Math.min(maxTranslateY, translateY));
      updateTransform();
    } else if (touchMode === 'swipe' && event.touches.length === 1) {
      const deltaY = event.touches[0].clientY - startY;
      if (Math.abs(deltaY) > 50) {
        touchMode = null;
      }
    }
  });
  
  imageWrapper.addEventListener('touchend', (event) => {
    if (touchMode === 'swipe' && event.changedTouches.length === 1) {
      const endX = event.changedTouches[0].clientX;
      const deltaX = endX - startX;
      const duration = Date.now() - startTime;
      if (Math.abs(deltaX) > 50 && duration < 500) {
        if (deltaX > 0) {
          changeImage(-1);
        } else {
          changeImage(1);
        }
      }
    }
    touchMode = null;
  });
  
  zoomInBtn.addEventListener('click', () => {
    zoomAtCenter(window.innerWidth / 2, window.innerHeight / 2, scaleFactor);
  });
  
  zoomOutBtn.addEventListener('click', () => {
    zoomAtCenter(window.innerWidth / 2, window.innerHeight / 2, 1 / scaleFactor);
  });
  
  resetBtn.addEventListener('click', resetView);
  
  // 页面初始化
  window.onload = async () => {
    console.log('页面加载启动...');
    
    // 如果策略不是纯本地，先加载映射表
    // if (LOAD_STRATEGY !== 'local') {
    //  await loadMapping();
    // }
    
    updatePageInfo();
    await loadImage(currentVol, currentPage);
  };
</script>
