<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
    <title>乾隆大藏经 · 168册目录</title>
<style>
h1 {
    text-align: center;
    font-size: 2em;
    margin-bottom: 30px;
    color: #333;
}
table {
    border-collapse: collapse;
    white-space: nowrap; 
    border: 1px solid #000; 
    border-collapse: collapse; 
    margin: 0 auto; 
    width: 80%;
    transform: scale(0.8);
    transform-origin: top center;
}
th, td {
    border: 1px solid #999;
    padding: 10px;
    text-align: left;
}
th {
    background-color: #f2f2f2;
}
a {
    color: #0066cc;
    text-decoration: none;
}
a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>
<h1>📜 乾隆大藏经 · 168册目录</h1>
<div id="volsTable" style="text-align:center;padding:40px;">加载中…</div>

<script type="module">
// 目录 C 图链接：从统一 mapping.json 生成，点击走统一 resolveImage 降级
import { resolveImage } from './js/imageLoader.js';

const R2_BASE = 'https://img.daxumi.top';

async function render() {
    const res = await fetch(new URL('./data/mapping.json', import.meta.url), { cache: 'force-cache' });
    if (!res.ok) {
        document.getElementById('volsTable').textContent = '⚠️ mapping.json 加载失败';
        return;
    }
    const mapping = await res.json();

    const vols = Object.keys(mapping).filter(v => v !== '000').sort();
    const cols = 4;
    let html = '<table><tr>';
    vols.forEach((vol, i) => {
        const catalog = mapping[vol].catalog || [];
        const links = catalog.map((id, idx) => {
            const name = `C${idx + 1}`;
            const r2 = `${R2_BASE}/${vol}/${name}.png`;
            return `<a href="${r2}" data-r2="${r2}" data-vol="${vol}" data-c="${name}">${name}</a>`;
        }).join(' ');
        html += `<td>第${vol}册</td><td>${links}</td>`;
        if ((i + 1) % cols === 0 && (i + 1) < vols.length) html += '</tr><tr>';
    });
    html += '</tr></table>';
    document.getElementById('volsTable').innerHTML = html;

    // 点击降级：先探测 R2，失败自动切 ImgBB / 其它源
    document.querySelectorAll('a[data-r2]').forEach(a => {
        a.addEventListener('click', async (e) => {
            e.preventDefault();
            const resolved = await resolveImage(a.dataset.r2);
            window.open(resolved || a.dataset.r2, '_blank', 'noopener');
        });
    });
}

render();
</script>
</body>
</html>
